/* ---------- zaman tüneli ---------- */
const cv=$("timeline"),g=cv.getContext("2d");let W=0,H=0;
function fit(){const r=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;
  if(!W||!H)return;cv.width=W*r|0;cv.height=H*r|0;g.setTransform(r,0,0,r,0,0);draw()}
new ResizeObserver(fit).observe(cv);
addEventListener("resize",fit);
const X=t=>(t-view.s)/view.w*W, T=x=>view.s+x/W*view.w;
const STEP=[60,120,300,600,900,1800,3600,7200,10800,21600];
if(!CanvasRenderingContext2D.prototype.roundRect)
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this};

function draw(){
  if(!W||P.classList.contains("preview"))return;
  if(CFG.centerPin){
    if(!dg&&!pinch&&!kayan){
      if(mode==="live")focus=canliAn();          /* canlıda zaman kendiliğinden akar */
      else{const p=head();if(p!=null)focus=p}
    }
    focus=sinirla(focus);
    view.s=focus-view.w/2;
  }
  syncDay();taraGorunen();canliBtnUI();
  const D=devicePixelRatio||1, q=v=>Math.round(v*D)/D, hp=.5/D;
  /* Boşta tünel inceldiğinde cetvel ve bant oranlı küçülür. */
  const dar=H<56;
  const R=dar?15:22, TOP=R, TR=H-R-(dar?2:3);
  const cs=getComputedStyle(document.body);
  const FS=cs.getPropertyValue("--sans"), FM=cs.getPropertyValue("--mono");
  g.clearRect(0,0,W,H);
  g.fillStyle="rgba(255,255,255,.03)";g.fillRect(0,0,W,R);

  /* zemin: taranmış günler koyu, bilinmeyenler nötr */
  g.fillStyle="rgba(255,255,255,.05)";g.fillRect(0,TOP+2,W,TR-4);
  for(const r of kapsanan){                    /* bilgi alınmış aralıklar biraz daha koyu */
    const a=q(Math.max(0,X(r.a))), b=q(Math.min(W,X(r.b)));
    if(b>a){g.fillStyle="rgba(255,255,255,.035)";g.fillRect(a,TOP+2,b-a,TR-4)}
  }
  /* kayıt bantları: gün sınırı tanımaz, tek liste */
  /* Kayıt, canlı yayının birkaç saniye ilerisinde olabilir: sunucu yazmayı
     sürdürürken yayın geriden gelir. O bölüm henüz gidilebilir bir yer olmadığı
     için bant canlı ucun ötesine çizilmez — veri silinmez, yalnızca gösterilmez. */
  const uc=canliAn();
  for(const r of tumRanges()){
    const a=q(Math.max(0,X(r.a))),b=q(Math.min(W,X(Math.min(r.b,uc))));
    if(b<=a)continue;
    g.fillStyle="rgba(62,207,142,.30)";g.fillRect(a,TOP+2,b-a,TR-4);
    g.fillStyle="rgba(62,207,142,.75)";g.fillRect(a,TOP+2,b-a,2);
  }

  /* cetvel: tikler yerel gün başlangıcına göre hizalanır */
  let st=21600;for(const x of STEP)if(x/view.w*W>=58){st=x;break}
  g.font=(dar?"9.5px ":"10.5px ")+FM;g.textBaseline="middle";g.lineWidth=1;
  const g0=dayStartOf(view.s);
  for(let t=g0+Math.floor((view.s-g0)/st)*st; t<=view.s+view.w; t+=st){
    const x=X(t);if(x<0||x>W)continue;
    const tod=todOf(t), maj=st>=3600?tod%3600===0:tod%(st*2)===0;
    const gx=q(x)+hp;
    g.strokeStyle=maj?"rgba(255,255,255,.16)":"rgba(255,255,255,.07)";
    g.beginPath();g.moveTo(gx,R);g.lineTo(gx,H-2);g.stroke();
    g.fillStyle=maj?"#a6b2c2":"#6b7787";
    g.textAlign=x<24?"left":x>W-24?"right":"center";
    g.fillText(st<60?hms(tod):hm(tod),q(clamp(x,3,W-3)),R/2);
  }

  /* gün sınırları */
  for(let d0=Math.ceil(view.s/DAY)*DAY-DAY; d0<view.s+view.w+DAY; d0+=DAY){
    const b0=dayStartOf(d0+DAY/2);            /* yaz saati kaymalarına dayanıklı */
    const x=q(X(b0));
    if(x<-60||x>W+60)continue;
    g.strokeStyle="rgba(255,255,255,.45)";g.setLineDash([2,3]);
    g.beginPath();g.moveTo(x,R);g.lineTo(x,H-2);g.stroke();g.setLineDash([]);
    const et=kisaTarih(dateOf(b0));
    g.font="600 9.5px "+FS;
    const tw=g.measureText(et).width+10;
    g.fillStyle="rgba(9,13,20,.75)";g.roundRect(x+3,H-18,tw,14,4);g.fill();
    g.fillStyle="#a6b2c2";g.textAlign="center";g.fillText(et,x+3+tw/2,H-11);
  }

  if(sel.a!=null&&sel.b!=null&&sel.b>sel.a){
    const a=q(X(sel.a)),b=q(X(sel.b));
    const CL=clip?"255,107,107":"74,168,255";
    g.fillStyle="rgba("+CL+",.22)";g.fillRect(a,TOP+2,b-a,TR-4);
    g.strokeStyle="rgb("+CL+")";g.lineWidth=2;g.beginPath();
    g.moveTo(a,TOP-3);g.lineTo(a,H-2);
    g.moveTo(b,TOP-3);g.lineTo(b,H-2);g.stroke();g.lineWidth=1;
    const va=Math.max(a,0), vb=Math.min(b,W);
    if(vb-va>62){const L=dur2(sel.b-sel.a),m=q((va+vb)/2);
      g.font=(dar?"600 9.5px ":"600 10.5px ")+FS;
      const w=q(g.measureText(L).width+14);
      g.fillStyle="rgb("+CL+")";g.roundRect(m-w/2,TOP+4,w,16,8);g.fill();
      g.fillStyle="#06121e";g.textAlign="center";g.fillText(L,m,TOP+12)}
  }
  const p=CFG.centerPin?focus:head();
  if(p!=null){const x=q(X(p));
    if(x>=-3&&x<=W+3){
      g.strokeStyle="#f0a13c";g.lineWidth=2;g.beginPath();
      g.moveTo(x,R+1);g.lineTo(x,H-2);g.stroke();g.lineWidth=1;
      g.fillStyle="#f0a13c";g.beginPath();
      g.moveTo(x-5,R+1);g.lineTo(x+5,R+1);g.lineTo(x,R+9);g.closePath();g.fill()}}
  /* Kesikli çizgi "duvar saati şimdi"yi değil, izlenebilecek en yeni anı —
     yani canlı ucu — gösterir. Yayın birkaç saniye geriden geldiği için ikisi
     aynı şey değil; kullanıcı açısından anlamlı olan, gidebileceği son nokta.
     Böylece canlıdayken pin, bandın ucu ve bu çizgi aynı yerde durur. */
  const nx=q(X(canliAn()));
  if(nx>=-40&&nx<=W+40){
    g.strokeStyle="rgba(62,207,142,.55)";g.setLineDash([3,3]);
    g.beginPath();g.moveTo(nx,R);g.lineTo(nx,H-2);g.stroke();g.setLineDash([]);
  }
  selUI();
}

let dg=null, pinch=null;
const pts=new Map();
const lx=e=>e.clientX-cv.getBoundingClientRect().left;

cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);const x=lx(e);pts.set(e.pointerId,x);
  if(pts.size===2){                                   /* iki parmak: yakınlaştırma */
    const v=[...pts.values()];
    dg=null;pinch={d:Math.abs(v[0]-v[1])||1,w:view.w,t:T((v[0]+v[1])/2)};
    return;
  }
  kayan=false;                                  /* kullanıcı dokundu: kayma biter */
  if(clip||preparing){dg=null;return}                 /* kayıt ve hazırlık sırasında zaman sabit */
  dg={x0:x,t0:T(x),v0:view.s,f0:focus,moved:false};    /* tek parmak: zamanda gezinme */
  cv.style.cursor="grabbing";
});

cv.addEventListener("pointermove",e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,lx(e));
  if(pinch&&pts.size>=2){
    const v=[...pts.values()],d=Math.abs(v[0]-v[1])||1,mid=(v[0]+v[1])/2;
    const w=clamp(pinch.w*pinch.d/d,+CFG.minSpan||120,+CFG.maxSpan||DAY);
    view.w=w;
    if(!CFG.centerPin)view.s=pinch.t-mid/W*w;
    return;
  }
  if(!dg)return;
  const x=lx(e);
  if(Math.abs(x-dg.x0)>3)dg.moved=true;
  if(CFG.centerPin)focus=sinirla(dg.f0-(x-dg.x0)/W*view.w);
  else view.s=dg.v0-(x-dg.x0)/W*view.w;
  draw();
});

function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2)pinch=null;
  cv.style.cursor="grab";
  if(pts.size){dg=null;return}                        /* hâlâ parmak varsa tıklama sayma */
  if(!dg)return;
  /* zaman yalnızca tüneli kaydırarak seçilir; boş dokunuş görüntüyü değiştirmez */
  const moved=dg.moved;
  if(moved)sonDokunus=0;                              /* kaydırma çift dokunuş sayılmaz */
  else if(ciftDokunusBak(lx(e))){dg=null;return}      /* çift dokunuş: yakınlaştır */
  const t=CFG.centerPin?focus:dg.t0;
  const seek=CFG.centerPin ? moved : !moved;
  dg=null;
  if(seek){if(CFG.centerPin)focus=t;kaynakSec(t)}
  draw();
}
cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",endPointer);

cv.addEventListener("wheel",e=>{e.preventDefault();
  const x=lx(e),a=T(x),w=clamp(view.w*(e.deltaY>0?1.35:1/1.35),+CFG.minSpan||120,+CFG.maxSpan||DAY);
  if(CFG.centerPin)view.w=w;                          /* merkez sabit, yalnızca ölçek değişir */
  else {view.s=a-x/W*w;view.w=w}
  draw()},{passive:false});
/* Çift dokunuş: tüm gün ↔ seçilen aralık. Yalnızca gerçek dokunuşlarda —
   hızlı ardışık kaydırmalar yanlışlıkla yakınlaştırma tetiklemesin diye
   hareket eden dokunuşlar sayılmaz ve iki dokunuş birbirine yakın olmalı. */
let sonDokunus=0, sonDokunusX=0;
function ciftDokunusBak(x){
  const t=Date.now();
  if(t-sonDokunus<320&&Math.abs(x-sonDokunusX)<30){
    sonDokunus=0;
    view.w = view.w>43200 ? clamp(CFG.viewSpan||3600,+CFG.minSpan||120,+CFG.maxSpan||DAY)
                          : (+CFG.maxSpan||DAY);
    if(!CFG.centerPin)view.s=T(x)-view.w/2;
    draw();return true;
  }
  sonDokunus=t;sonDokunusX=x;return false;
}

/* ---------- seçim ---------- */
/* baloncuk üç durumda: boşta → Klip · kayıtta → Durdur+süre · seçim varsa → İndir */
function selUI(){
  /* Kayıt ve hazırlık sırasında zamanı değiştiren düğmeler kilitlenir:
     tarih değişimi ya da canlıya dönüş, süren kaydı ortada bırakırdı. */
  P.classList.toggle("kilit", !!(clip||preparing));
  const b=$("bubble");
  if(mode!=="rec"||!seg.st||P.classList.contains("preview")){b.className="";return}
  const hazir=seg.ready&&!video.paused&&!video.ended;
  b.className="on "+(clip?"clip":"idle")+((!clip&&!hazir)?" notready":"");
  $("btnClip").classList.toggle("on",!!clip);
  if(preparing){b.className="on prep";bubblePos();return}   /* etiket hazırlık göstergesinde */
  if(clip){
    $("clipLbl").textContent="Durdur "+hms(Math.max(0,sel.b-sel.a)).slice(3);
    $("selText").innerHTML="<em>"+hmsAbs(sel.a)+"</em> →";
  }else $("clipLbl").textContent="Kaydı Başlat";
  bubblePos();
}
/* baloncuğu ilgili noktanın üstüne yerleştir, tünel kenarlarını taşırma */
function bubblePos(){
  const b=$("bubble");
  if(!b.classList.contains("on")||!W)return;
  const p=CFG.centerPin?focus:head();
  const target = p!=null ? X(p) : W/2;
  const bw=b.offsetWidth, half=bw/2;
  const left=$("dayBtn").offsetWidth+10;              /* tarih butonunun üstüne binmesin */
  /* centerPin açıkken baloncuk da diğer sabit öğeler gibi ortada durur */
  const raw = CFG.centerPin ? W/2 : target;
  const lo=Math.min(left+half,W/2+left/2), hi=Math.max(W-half-4,W/2);
  const cx=clamp(raw,lo,hi);
  b.style.left=cx+"px";
  b.style.setProperty("--arrow",clamp(target-(cx-half),12,bw-12)+"px");
}
/* ---------- işaretli aralığı belleğe alma ----------
   Kayıt durdurulunca dosya tünel görünümündeyken indirilir. Önizleme ekranı
   ancak dosya hazır olduğunda açılır; orada her şey yerelden çalışır:
   ileri sarma anında, indirme ve paylaşma beklemesiz. */
let clipCache=null, clipReq=null, clipPct=0, clipBytes=0, clipTotal=0, blobUrl=null, preparing=false;
const clipKey=(st,d)=>+st+"|"+d;

function dropBlobUrl(){
  if(!blobUrl)return;
  const u=blobUrl;blobUrl=null;
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
/* hazırlık göstergesi: düğme dokunur dokunmaz pasifleşir ve dönen halkaya geçer */
let prepMeta=null, finishT=null;
const PREP_FINISH_MS=420;      /* tamamlanma anının görünür kalma süresi */
function prepStart(){
  const b=$("btnClip");
  b.classList.remove("on");b.classList.add("prep");
  b.style.setProperty("--p","0%");
  $("clipLbl").textContent="Bekleyin";
  $("selText").innerHTML="<em>"+hmsAbs(sel.a)+"</em> → <em>"+hmsAbs(sel.b)+"</em>";
  $("bubble").className="on prep";
  bubblePos();
}
function prepUI(){
  if(!preparing||!clipTotal)return;
  $("btnClip").style.setProperty("--p",Math.min(88,Math.round(clipPct*100))+"%");
  /* son bölümde metin değişir: iş bitmek üzere */
  $("clipLbl").textContent = clipPct>=.55 ? "Bitiriliyor" : "Bekleyin";
}
function prepClear(){
  clearTimeout(finishT);finishT=null;
  preparing=false;prepMeta=null;
  const b=$("btnClip");b.classList.remove("prep");b.style.removeProperty("--p");
}
/* önizleme başlığındaki dosya boyutu */
function sizeUI(){
  const el=$("pvSize");if(!el)return;
  el.textContent=clipCache?mb(clipCache.blob.size):"";
}

function prefetchAbort(){
  if(clipReq){try{clipReq.ctrl.abort()}catch(e){}}
  clipReq=null;clipCache=null;clipPct=0;clipBytes=0;clipTotal=0;dropBlobUrl();sizeUI();
}
function prefetchClip(st,d){
  prefetchAbort();
  if(!CFG.prefetch)return;
  const key=clipKey(st,d), name=fname(st,d), ctrl=new AbortController();
  const promise=(async()=>{
    const r=await fetch(recUrl(st,d,true),{credentials:"omit",signal:ctrl.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);
    clipTotal=+(r.headers.get("content-length")||0);
    let blob;
    if(r.body&&r.body.getReader){
      const rd=r.body.getReader(),parts=[];let got=0;
      for(;;){const{done,value}=await rd.read();if(done)break;
        parts.push(value);got+=value.length;clipBytes=got;
        if(clipTotal)clipPct=got/clipTotal;
        prepUI();}
      blob=new Blob(parts,{type:"video/mp4"});
    }else blob=await r.blob();
    clipPct=1;clipCache={key,blob,name};sizeUI();
    clipReady();
    return clipCache;
  })();
  promise.catch(()=>{if(clipReq&&clipReq.key===key){clipReq=null}prepareFailed()});
  clipReq={key,promise,ctrl};prepUI();
}

/* dosya hazır: önizlemeyi aç ve oynatmayı blob üzerinden başlat */
function clipReady(){
  if(!clipCache)return;
  if(!preparing){attachBlob(false);return}
  /* dosya çok hızlı inebiliyor; tamamlandığı kısa bir an görünür kalsın */
  $("clipLbl").textContent="Bitiriliyor";
  clearTimeout(finishT);
  finishT=setTimeout(finishPrep,PREP_FINISH_MS);
}
function finishPrep(){
  if(!preparing)return;
  const meta=prepMeta;
  prepClear();
  if(meta)seg={st:meta.st,d:meta.len,locked:true,ready:false};
  enterPreview();
  attachBlob(true);
}
function attachBlob(fromStart){
  if(!clipCache||blobUrl)return;
  killHls();                                    /* önizleme her zaman bellekten oynar */
  const t=fromStart?0:(video.currentTime||0);
  const wasPlaying=fromStart||!video.paused;
  blobUrl=URL.createObjectURL(clipCache.blob);
  video.addEventListener("loadedmetadata",()=>{
    try{video.currentTime=Math.min(t,(video.duration||t))}catch(e){}
    hideCenter();stat("İşaretli aralık · "+dur2(seg.d||0),"on");
    if(wasPlaying)play();
    pvSync();
  },{once:true});
  video.src=blobUrl;video.load();
}
/* dosya alınamazsa sunucudan oynatmaya düşülür */
function prepareFailed(){
  if(!preparing)return;
  const meta=prepMeta;prepClear();hideCenter();
  if(meta){load(meta.st.getTime()/1000,meta.len,true);enterPreview()}
  stat("Bellekten alınamadı","err");
}

/* hazırsa anında, hâlâ iniyorsa bekleyerek döner; başarısızsa null */
async function clipData(st,d){
  const key=clipKey(st,d);
  if(clipCache&&clipCache.key===key)return clipCache;
  if(clipReq&&clipReq.key===key){try{return await clipReq.promise}catch(e){return null}}
  return null;
}

/* dosyayı belleğe indirip cihazın paylaşım sayfasına verir (WhatsApp, Mesajlar, AirDrop…) */

/* ---------- çıktı penceresi ----------
   İndir ve Paylaş bu pencereyi açar. Hazırlık burada yapılır, ilerleme burada
   görünür ve dosya buradan verilir. Böylece paylaşım penceresi kullanıcının
   taze dokunuşuyla açılır: uzun süren ses işlemesi tarayıcının iznini
   düşürdüğü için doğrudan paylaşmak çalışmıyordu. */
let ckHazir=null, ckCalisiyor=false, ckMod="dl";

const boyutYaz=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB";
const bicimYaz=t=>{
  t=String(t||"").toLowerCase();
  if(t.indexOf("mp4")>=0)return "MP4 · H.264";
  if(t.indexOf("webm")>=0)return t.indexOf("vp9")>=0?"WebM · VP9":"WebM · VP8";
  return t.split("/").pop().toUpperCase()||"—";
};

function ckKapat(){$("ciktiModal").classList.remove("on")}

const CK_IKON={
  dl:'<path d="M12 4v12M12 16l-4-4M12 16l4-4M5 19h14"/>',
  share:'<path d="M12 16V4M12 4 8 8M12 4l4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/>'
};
async function ciktiAc(mod){
  if(sel.a==null||sel.b==null||ckCalisiyor)return;
  ckMod=(mod==="share"&&canShareFiles)?"share":"dl";      /* paylaşım yoksa indirme */

  const st=dateOf(sel.a), d=Math.round(sel.b-sel.a);
  const imza=clipKey(st,d)+"::"+sesImza();
  if(ckHazir&&ckHazir.imza===imza){ckGoster();return}     /* hazır: yeniden üretme */

  ckCalisiyor=true;
  $("ckBaslik").textContent="Klip hazırlanıyor";
  ckIlerleme(0);
  ckBilgiYaz([
    ["Zaman", hmsAbs(sel.a)+" → "+hmsAbs(sel.b)],
    ["Süre", d+" sn"],
    ["Ses", sesIsaret.length?(sesIsaret.length+" ses eklendi"):"eklenmedi"]
  ]);
  try{
    let c=await clipData(st,d);
    if(!c){                                               /* önbellekte yoksa indir */
      ckIlerleme(.1,"Kayıt alınıyor");
      const r=await fetch(recUrl(st,d,true),{credentials:"omit"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      c={blob:await r.blob(),name:fname(st,d)};
    }
    ckIlerleme(.25);
    if(sesIsaret.length&&sesliOlabilir()){
      $("ckBaslik").textContent="Ses işleniyor";
      c=await sesliUret(c.blob,c.name,p=>ckIlerleme(.25+p*.75));
    }else if(sesIsaret.length){
      stat("Bu tarayıcı ses gömmeyi desteklemiyor","err");
    }
    ckIlerleme(1);
    ckHazir={imza,blob:c.blob,name:c.name,
             en:c.en||video.videoWidth||0, boy:c.boy||video.videoHeight||0};
    ckGoster();
  }catch(e){
    $("ckBaslik").textContent="Hazırlanamadı";
    ckBilgiYaz([["Sebep",(e&&e.message)||"bilinmiyor"]]);
  }finally{ckCalisiyor=false}
}
function ckGoster(){

}

/* ---------- klibe ses ekleme ----------
   Sesler CFG.sesler listesinden gelir: {ad:"Alkış", url:"alkis.mp3"}. Göreli
   adresler CFG.sesKok ile birleştirilir. İşaretler klibe bakarken duyulur ve
   paylaşırken dosyaya gömülür. */
let AC=null;
const acKur=()=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();return AC};

const sesBellek={};
const sesAdres=t=>/^https?:|^\//i.test(t.url) ? t.url : (CFG.sesKok||"")+t.url;

/* Ses verisini karıştırabilmek için sunucunun çapraz köken izni (CORS) vermesi
   gerekiyor. İzin yoksa dosya yine de <audio> ile çalınabilir — önizlemede
   duyulur ama klibe gömülemez. O yüzden iki yol denenir. */
async function sesAl(t){
  const anahtar=t.id||t.url;
  if(sesBellek[anahtar])return sesBellek[anahtar];
  let kayit;
  {
    const adres=sesAdres(t);
    let sebep="";
    try{
      /* cache:"reload" önemli: izin başlığı eklenmeden önce alınmış yanıtlar
         tarayıcı önbeleğinde izinsiz olarak duruyor ve okuma reddedilmeye
         devam ediyor. Yine olmazsa adrese damga ekleyip bir kez daha denenir. */
      let r=null;
      try{ r=await fetch(adres,{cache:"reload"}) }
      catch(ilk){
        sebep=(ilk&&ilk.message)||"erişim";
        const damga=adres+(adres.indexOf("?")>=0?"&":"?")+"cb="+Date.now();
        r=await fetch(damga,{cache:"reload"});
      }
      if(!r.ok)throw new Error("HTTP "+r.status);
      const ham=await r.arrayBuffer();
      try{ const b=await acKur().decodeAudioData(ham);kayit={buf:b,sure:b.duration||0} }
      catch(coz){ sebep="ses çözülemedi"; throw coz }
    }catch(e){
      if(!sebep)sebep=(e&&e.message)||"bilinmeyen";
      /* CORS ya da ağ: çalınabiliyor mu diye <audio> ile dene */
      const a=new Audio();
      a.preload="auto";a.src=adres;
      await new Promise((ok,no)=>{
        a.oncanplaythrough=()=>ok(); a.onloadeddata=()=>ok();
        a.onerror=()=>no(new Error("ses açılamadı"));
        setTimeout(()=>no(new Error("ses zaman aşımı")),12000);
      });
      /* Uyarıyı burada göstermiyoruz: bir kez tetiklenip ekranda kalıyor ve
         sonradan sorunsuz yüklenen sesler varken yanıltıyordu. Gerçek durum
         işaretin renginde ve çıktı penceresindeki sayımda görünür. */
      kayit={el:a, gomulemez:true, sebep, sure:a.duration||0};
    }
  }
  sesBellek[anahtar]=kayit;
  return kayit;
}

/* Listede dinleme: sesi eklemeden çalar. İkinci dokunuş durdurur. */
let dinlenen=null;
function dinlemeDurdur(){
  if(!dinlenen)return;
  try{dinlenen.src?dinlenen.src.stop():dinlenen.el.pause()}catch(e){}
  if(dinlenen.dugme)dinlenen.dugme.classList.remove("caliyor");
  dinlenen=null;
}
async function sesDinle(t,dugme){
  const ayni=dinlenen&&dinlenen.dugme===dugme;
  dinlemeDurdur();
  if(ayni)return;                              /* aynı sese tekrar: durdur */
  dugme.classList.add("yukleniyor");
  try{
    const kayit=await sesAl(t);
    dugme.classList.remove("yukleniyor");
    if(kayit.buf){
      const ac=acKur(), src=ac.createBufferSource();
      src.buffer=kayit.buf;
      const g=ac.createGain();g.gain.value=+CFG.sesSeviye||0.85;
      src.connect(g).connect(ac.destination);
      src.onended=()=>{if(dinlenen&&dinlenen.src===src)dinlemeDurdur()};
      src.start();
      dinlenen={src,dugme};
    }else if(kayit.el){
      const a=kayit.el.cloneNode();
      a.volume=+CFG.sesSeviye||0.85;
      a.onended=()=>{if(dinlenen&&dinlenen.el===a)dinlemeDurdur()};
      a.currentTime=0;a.play().catch(()=>{});
      dinlenen={el:a,dugme};
    }
    dugme.classList.add("caliyor");
  }catch(e){
    dugme.classList.remove("yukleniyor");
    dugme.classList.add("hatali");setTimeout(()=>dugme.classList.remove("hatali"),1600);
  }
}

async function sesEkle(t,btn){

              gomulemez:!!kayit.gomulemez, sebep:kayit.sebep};

      btn.classList.add("hatali");setTimeout(()=>btn.classList.remove("hatali"),1600)}
    stat("Ses yüklenemedi","err");
    return;                                   /* pencere açık kalsın: başkası seçilebilir */

}
/* Eklerken ya da listede dinlerken tek seferlik çalma. Oynatma sırasındaki
   sesleri bu değil, aşağıdaki denetleyici yönetir. */
function sesOnizle(im){
  dinlemeDurdur();
  try{
    if(im.buf){
      const ac=acKur(), src=ac.createBufferSource();
      src.buffer=im.buf;
      const g=ac.createGain();g.gain.value=+CFG.sesSeviye||0.85;
      src.connect(g).connect(ac.destination);
      src.onended=()=>{if(dinlenen&&dinlenen.src===src)dinlemeDurdur()};
      src.start();
      dinlenen={src,dugme:null};
    }else if(im.el){
      const a=im.el.cloneNode();
      a.volume=+CFG.sesSeviye||0.85;
      a.onended=()=>{if(dinlenen&&dinlenen.el===a)dinlemeDurdur()};
      a.currentTime=0;a.play().catch(()=>{});
      dinlenen={el:a,dugme:null};
    }
  }catch(e){}
}

/* oynatma sırasında sırası gelen sesleri çal */
/* ---------- eklenen seslerin oynatımı ----------
   Sesler videonun ikinci bir ses izi gibi davranır: oynatma kafası bir sesin
   aralığındaysa o ses duyulur, değilse susar. Her karede denetlenir; böylece
   duraklatma, atlama, geri sarma ve hız değişimi kendiliğinden doğru çalışır.
   Eskiden "geçerken bir kez çal" mantığı vardı ve sesin ortasına atlayınca
   hiç duyulmuyor, duraklatınca da susmuyordu. */
function sesBasla(im,kayma,hiz){
  try{
    if(im.buf){
      const ac=acKur(), src=ac.createBufferSource();
      src.buffer=im.buf;
      try{src.playbackRate.value=hiz}catch(e){}
      const g=ac.createGain();g.gain.value=+CFG.sesSeviye||0.85;
      src.connect(g).connect(ac.destination);
      src.onended=()=>{if(im.aktif&&im.aktif.src===src)im.aktif=null};
      src.start(0,Math.max(0,kayma));
      im.aktif={src,hiz};
    }else if(im.el){
      const a=im.el.cloneNode();
      a.volume=+CFG.sesSeviye||0.85;
      try{a.playbackRate=hiz}catch(e){}
      a.currentTime=Math.max(0,kayma);a.play().catch(()=>{});
      im.aktif={el:a,hiz};
    }
  }catch(e){}
}
function sesBitir(im){
  if(!im.aktif)return;
  try{im.aktif.src?im.aktif.src.stop():im.aktif.el.pause()}catch(e){}
  im.aktif=null;
}
function seslerSustur(){sesIsaret.forEach(sesBitir)}

function sesTakip(){
  const onizleme=P.classList.contains("preview");
  const oynuyor=onizleme&&!video.paused&&!video.ended;
  if(!onizleme){seslerSustur();return}
  const an=video.currentTime||0, hiz=video.playbackRate||1;
  sesIsaret.forEach(im=>{
    const sure=im.sure||0.4;
    const icinde=an>=im.t-0.03&&an<im.t+sure;
    if(oynuyor&&icinde){
      if(!im.aktif)sesBasla(im,an-im.t,hiz);
      else if(im.aktif.hiz!==hiz){sesBitir(im);sesBasla(im,an-im.t,hiz)}   /* hız değişti */
    }else if(im.aktif)sesBitir(im);
  });
}
/* atlama ve duraklatma anında beklemeden tepki ver */
video.addEventListener("seeking",()=>{if(P.classList.contains("preview"))seslerSustur()});
video.addEventListener("pause",()=>{if(P.classList.contains("preview"))seslerSustur()});

/* ---------- sesleri dosyaya gömme ----------
   Tarayıcıda bir mp4'ün ses izini tek başına değiştirmek mümkün değil; yeniden
   kodlamak gerekiyor. Klip gerçek zamanlı oynatılır, kareler bir tuvale çizilir,
   yayının sesi ile eklenen sesler karıştırılır ve hepsi yeni bir dosyaya yazılır.
   Bu yüzden 30 saniyelik klip 30 saniye sürer. Ses eklenmemişse dosyaya hiç
   dokunulmaz: özgün kopya bayt bayt korunur. */
const sesliOlabilir=()=>!!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream&&
  (window.AudioContext||window.webkitAudioContext));
function sesliTur(){
  const l=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4",
           "video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  for(const m of l)if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;
  return "";
}
async function sesliUret(blob,ad,ilerleme){
  const ac=acKur();
  const u=URL.createObjectURL(blob);
  const v=document.createElement("video");
  v.src=u;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";
  v.style.cssText="position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0";
  document.body.appendChild(v);
  const temizle=()=>{try{v.remove()}catch(e){}setTimeout(()=>URL.revokeObjectURL(u),3000)};
  try{
    await new Promise((ok,no)=>{v.onloadedmetadata=()=>ok();v.onerror=()=>no(new Error("klip açılamadı"))});
    const enBoy=+CFG.sesliEn||1280;
    const k=Math.min(1,enBoy/(v.videoWidth||enBoy));
    const cw=Math.max(2,Math.round((v.videoWidth||1280)*k/2)*2);
    const ch=Math.max(2,Math.round((v.videoHeight||720)*k/2)*2);
    const tuval=document.createElement("canvas");tuval.width=cw;tuval.height=ch;
    const cx=tuval.getContext("2d");
    const gorTrack=tuval.captureStream(+CFG.sesliFps||25);
    const hedef=ac.createMediaStreamDestination();
    const kaynak=ac.createMediaElementSource(v);      /* ses hoparlöre değil kayda gider */
    kaynak.connect(hedef);
    const akis=new MediaStream([...gorTrack.getVideoTracks(),...hedef.stream.getAudioTracks()]);
    const tur=sesliTur();
    const rec=new MediaRecorder(akis,Object.assign(
      {videoBitsPerSecond:(+CFG.sesliKbps||4000)*1000,audioBitsPerSecond:128000},
      tur?{mimeType:tur}:{}));
    const parca=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)parca.push(e.data)};
    const kayitBitti=new Promise(ok=>{rec.onstop=ok});

    const t0=ac.currentTime+.15;                      /* sesleri zamanla */
    sesIsaret.forEach(im=>{
      if(!im.buf)return;                              /* izin yok: gömülemez */
      const sr=ac.createBufferSource();sr.buffer=im.buf;
      const g=ac.createGain();g.gain.value=+CFG.sesSeviye||0.85;
      sr.connect(g).connect(hedef);
      sr.start(t0+im.t);
    });

    rec.start(250);
    try{v.currentTime=0}catch(e){}
    await v.play();
    let dur=false;
    const ciz=()=>{
      if(dur)return;
      try{cx.drawImage(v,0,0,cw,ch)}catch(e){}
      if(ilerleme&&v.duration)ilerleme(Math.min(1,v.currentTime/v.duration));
      if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(ciz);
      else requestAnimationFrame(ciz);
    };
    ciz();
    await new Promise(ok=>{v.onended=ok;setTimeout(ok,((v.duration||60)+8)*1000)});
    dur=true;
    await new Promise(ok=>setTimeout(ok,300));        /* son kareler yazılsın */
    rec.stop();await kayitBitti;
    try{kaynak.disconnect()}catch(e){}
    const mt=(rec.mimeType||tur||"video/webm").split(";")[0];
    const uz=mt.indexOf("mp4")>=0?"mp4":"webm";
    return {blob:new Blob(parca,{type:mt}),
            name:ad.replace(/\.[^.]+$/,"")+"_sesli."+uz, en:cw, boy:ch};
  }finally{temizle()}
}
const sesImza=()=>sesIsaret.map(im=>im.ad+"@"+im.t.toFixed(2)).join("|");

$("pvSes").onclick=sesPencereAc;
$("sesClose").onclick=sesPencereKapat;

/* ---------- kare yakalama ve işaretleme ----------
   Klip blob üzerinden oynatıldığı için tuval "kirlenmez"; kare doğrudan
   alınabilir. Şekiller 0–1 aralığında saklanır, böylece hem ekranda hem tam
   çözünürlüklü çıktıda aynı yerde görünür ve geri alma sağlıklı çalışır. */
let shotBase=null, shotIlk=null, kirpma=null, gecmis=[],
    sekiller=[], aktifSekil=null, arac="pen", renk="#ff3b30", shotRect=null;
const scv=$("shotCv"), sctx=scv.getContext("2d");

/* Klip bellekten (blob) oynatıldığı için tuval kirlenmez; kare doğrudan alınır. */
function shotOpen(){
  if(P.classList.contains("shooting"))return;
  if(!video.videoWidth){stat("Kare alınamadı","err");return}
  try{video.pause()}catch(e){}
  shotBase=document.createElement("canvas");
  shotBase.width=video.videoWidth;shotBase.height=video.videoHeight;
  shotBase.getContext("2d").drawImage(video,0,0);
  shotIlk=shotBase;kirpma=null;gecmis=[];
  P.classList.remove("cropping","cropped");
  sekiller=[];aktifSekil=null;
  P.classList.add("shooting");$("shot").classList.add("on");
  aracSec(arac==="crop"?"pen":arac);          /* ölçüm için ekran görünür olmalı */
  requestAnimationFrame(()=>{shotFit();okHizala(arac)});
}
function shotClose(){
  if(!P.classList.contains("shooting"))return;
  $("shot").classList.remove("on");P.classList.remove("shooting");
  shotBase=null;shotIlk=null;kirpma=null;gecmis=[];sekiller=[];aktifSekil=null;
  P.classList.remove("cropping","cropped");
  if(mode==="rec"&&seg.st&&!video.ended)play();   /* izleme kaldığı yerden sürer */
}
$("pvShot").onclick=()=>shotOpen();
$("shotBack").onclick=shotClose;

/* tuvali kaba sığdır ve görüntü dikdörtgenini hesapla */
function shotFit(){
  if(!shotBase)return;
  const D=devicePixelRatio||1, cw=scv.clientWidth, ch=scv.clientHeight;
  if(!cw||!ch)return;
  scv.width=Math.round(cw*D);scv.height=Math.round(ch*D);
  sctx.setTransform(D,0,0,D,0,0);
  const k=Math.min(cw/shotBase.width,ch/shotBase.height);
  const w=shotBase.width*k, h=shotBase.height*k;
  shotRect={x:(cw-w)/2,y:(ch-h)/2,w,h};
  shotRender();
}
new ResizeObserver(()=>shotFit()).observe(scv);

/* şekilleri verilen ölçekte çiz — hem ekran hem çıktı aynı fonksiyonu kullanır */
function sekilleriCiz(c,x0,y0,w,h){
  const kal=Math.max(2,w*.006);
  c.lineCap="round";c.lineJoin="round";
  const P2=(p)=>[x0+p.x*w, y0+p.y*h];
  for(const sk of sekiller.concat(aktifSekil?[aktifSekil]:[])){
    c.strokeStyle=sk.renk;c.lineWidth=kal;
    c.shadowColor="rgba(0,0,0,.45)";c.shadowBlur=kal*1.2;
    if(sk.tip==="pen"){
      c.beginPath();sk.pts.forEach((p,i)=>{const[a,b]=P2(p);i?c.lineTo(a,b):c.moveTo(a,b)});c.stroke();
    }else if(sk.tip==="arrow"){
      const[ax,ay]=P2(sk.pts[0]),[bx,by]=P2(sk.pts[1]);
      c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();
      const ang=Math.atan2(by-ay,bx-ax), u=kal*3.5;
      c.beginPath();c.moveTo(bx,by);
      c.lineTo(bx-u*Math.cos(ang-.4),by-u*Math.sin(ang-.4));
      c.moveTo(bx,by);
      c.lineTo(bx-u*Math.cos(ang+.4),by-u*Math.sin(ang+.4));
      c.stroke();
    }else if(sk.tip==="rect"){
      const[ax,ay]=P2(sk.pts[0]),[bx,by]=P2(sk.pts[1]);
      c.beginPath();c.rect(Math.min(ax,bx),Math.min(ay,by),Math.abs(bx-ax),Math.abs(by-ay));c.stroke();
    }else{
      const[ax,ay]=P2(sk.pts[0]),[bx,by]=P2(sk.pts[1]);
      c.beginPath();
      c.ellipse((ax+bx)/2,(ay+by)/2,Math.abs(bx-ax)/2,Math.abs(by-ay)/2,0,0,6.284);
      c.stroke();
    }
    c.shadowBlur=0;
  }
}
function shotRender(){
  if(!shotBase||!shotRect)return;
  const cw=scv.clientWidth, ch=scv.clientHeight;
  sctx.clearRect(0,0,cw,ch);
  sctx.drawImage(shotBase,shotRect.x,shotRect.y,shotRect.w,shotRect.h);
  sekilleriCiz(sctx,shotRect.x,shotRect.y,shotRect.w,shotRect.h);
  $("shotUndo").disabled=!gecmis.length;        /* çizim ya da kırpma: son işlem */
  $("shotClear").disabled=!sekiller.length;
  if(kirpma){                                   /* dışarısı karartılır, üçte bir çizgileri */
    const R=shotRect;
    const x=R.x+kirpma.x*R.w, y=R.y+kirpma.y*R.h, w=kirpma.w*R.w, h=kirpma.h*R.h;
    sctx.fillStyle="rgba(3,6,11,.62)";
    sctx.fillRect(R.x,R.y,R.w,y-R.y);
    sctx.fillRect(R.x,y+h,R.w,R.y+R.h-(y+h));
    sctx.fillRect(R.x,y,x-R.x,h);
    sctx.fillRect(x+w,y,R.x+R.w-(x+w),h);
    sctx.strokeStyle="#fff";sctx.lineWidth=1.5;sctx.strokeRect(x,y,w,h);
    sctx.strokeStyle="rgba(255,255,255,.35)";sctx.lineWidth=1;
    sctx.beginPath();
    for(let i=1;i<3;i++){
      sctx.moveTo(x+w*i/3,y);sctx.lineTo(x+w*i/3,y+h);
      sctx.moveTo(x,y+h*i/3);sctx.lineTo(x+w,y+h*i/3);
    }
    sctx.stroke();
  }
}

/* ---- çizim ---- */
const shotNorm=e=>{
  const r=scv.getBoundingClientRect();
  return {x:clamp((e.clientX-r.left-shotRect.x)/shotRect.w,0,1),
          y:clamp((e.clientY-r.top-shotRect.y)/shotRect.h,0,1)};
};
const shotIcinde=e=>{
  if(!shotRect)return false;
  const r=scv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  return x>=shotRect.x&&x<=shotRect.x+shotRect.w&&y>=shotRect.y&&y<=shotRect.y+shotRect.h;
};
scv.addEventListener("pointerdown",e=>{
  if(!shotBase||!shotIcinde(e))return;        /* görüntünün dışına çizilmez */
  scv.setPointerCapture(e.pointerId);
  if(arac==="crop"){const p=shotNorm(e);kirpma={x0:p.x,y0:p.y,x:p.x,y:p.y,w:0,h:0};
    P.classList.add("cropping");shotRender();return}
  aktifSekil={tip:arac,renk,pts:[shotNorm(e),shotNorm(e)]};
  shotRender();
});
scv.addEventListener("pointermove",e=>{
  if(kirpma&&arac==="crop"&&kirpma.x0!=null){
    const p=shotNorm(e);
    kirpma.x=Math.min(kirpma.x0,p.x);kirpma.y=Math.min(kirpma.y0,p.y);
    kirpma.w=Math.abs(p.x-kirpma.x0);kirpma.h=Math.abs(p.y-kirpma.y0);
    shotRender();return;
  }
  if(!aktifSekil)return;
  const p=shotNorm(e);
  if(aktifSekil.tip==="pen")aktifSekil.pts.push(p); else aktifSekil.pts[1]=p;
  shotRender();
});
function shotBitir(){
  if(kirpma&&kirpma.x0!=null){
    kirpma.x0=null;                               /* seçim tamam, onay bekleniyor */
    if(kirpma.w<.05||kirpma.h<.05)kirpIptal();
    else shotRender();
    return;
  }
  if(!aktifSekil)return;
  const p=aktifSekil.pts;
  const yeterli=aktifSekil.tip==="pen" ? p.length>2
    : Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)>.02;
  if(yeterli){kaydet();sekiller.push(aktifSekil)}
  aktifSekil=null;shotRender();
}
scv.addEventListener("pointerup",shotBitir);
scv.addEventListener("pointercancel",shotBitir);

function paletKapat(){$("renkler").classList.remove("acik")}
/* baloncuğun oku, seçili aracın hizasına gelir */
function okHizala(t){
  const b=document.querySelector('.tool[data-tool="'+t+'"]');
  if(!b)return;
  $("renkler").style.setProperty("--ok",(b.offsetTop+b.offsetHeight/2)+"px");
}
function aracSec(t){
  arac=t;
  document.querySelectorAll(".tool").forEach(x=>x.classList.toggle("on",x.dataset.tool===t));
  if(t==="crop"){paletKapat();return}
  if(kirpma)kirpIptal();
  /* çizim aracına dokununca palet açılır; aynı araca tekrar dokunmak kapatır */
  $("renkler").classList.add("acik");            /* çizim aracı seçiliyse palet açık */
  okHizala(t);
}
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>aracSec(b.dataset.tool));
document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{
  renk=b.dataset.color;
  $("shot").style.setProperty("--renk",renk);        /* etkin araç ikonu da bu rengi alır */
  document.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b));
});
/* Tek geri alma: çizim ve kırpma aynı yığında tutulur, son işlem geri alınır. */
function kaydet(){
  gecmis.push({base:shotBase, sek:sekiller.map(k=>({tip:k.tip,renk:k.renk,pts:k.pts.map(p=>({x:p.x,y:p.y}))}))});
  if(gecmis.length>60)gecmis.shift();
}
function geriAl(){
  const g=gecmis.pop();if(!g)return;
  const olcuDegisti=g.base!==shotBase;
  shotBase=g.base;sekiller=g.sek;aktifSekil=null;kirpma=null;
  P.classList.remove("cropping");
  P.classList.toggle("cropped",shotBase!==shotIlk);
  if(olcuDegisti)shotFit(); else shotRender();
}

/* --- kırpma --- */
function kirpIptal(){
  kirpma=null;P.classList.remove("cropping");shotRender();
}
function kirpUygula(){
  if(!kirpma||kirpma.w<.05||kirpma.h<.05){kirpIptal();return}
  const k={x:kirpma.x,y:kirpma.y,w:kirpma.w,h:kirpma.h};
  const sx=Math.round(k.x*shotBase.width), sy=Math.round(k.y*shotBase.height);
  const sw=Math.max(8,Math.round(k.w*shotBase.width)), sh=Math.max(8,Math.round(k.h*shotBase.height));
  const c=document.createElement("canvas");c.width=sw;c.height=sh;
  c.getContext("2d").drawImage(shotBase,sx,sy,sw,sh,0,0,sw,sh);
  kaydet();shotBase=c;
  /* şekiller yeni çerçeveye taşınır, tamamen dışarıda kalanlar düşer */
  sekiller=sekiller
    .map(sk=>({...sk,pts:sk.pts.map(p=>({x:(p.x-k.x)/k.w,y:(p.y-k.y)/k.h}))}))
    .filter(sk=>sk.pts.some(p=>p.x>-.05&&p.x<1.05&&p.y>-.05&&p.y<1.05));
  kirpma=null;P.classList.remove("cropping");P.classList.add("cropped");
  aracSec("pen");
  shotFit();
}
$("cropApply").onclick=kirpUygula;
$("cropCancel").onclick=kirpIptal;
$("shotUndo").onclick=geriAl;
$("shotClear").onclick=()=>{if(!sekiller.length)return;kaydet();sekiller=[];shotRender()};

/* ---- çıktı: tam çözünürlük ---- */
function shotBlob(){
  return new Promise(res=>{
    const c=document.createElement("canvas");
    c.width=shotBase.width;c.height=shotBase.height;
    const x=c.getContext("2d");
    x.drawImage(shotBase,0,0);
    sekilleriCiz(x,0,0,c.width,c.height);
    c.toBlob(b=>res(b),"image/png");
  });
}
const shotAd=()=>{

/* ---------- kamera seçimi ----------
   Kameralar farklı sunucularda olabildiği için değişimde adres kökü, kimlik
   bilgileri ve tüm kayıt önbelleği sıfırlanır. */
function camListe(){
  const L=KAMERALAR(), el=$("camList");
  el.innerHTML="";
  L.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="cam-sec"+(i===AK?" on":"");

/* ---------- kamera anlık görüntüleri ----------
   Sunucu kareyi düz bir HTTP adresinden JPEG olarak veriyor. Seçici açılınca
   beklememek için üç katman var: açılışta ısıtma, düğmeye dokunulduğu anda
   erken başlatma ve bellekte tutma. Bekleyen bir görüntü varsa önce o gösterilir,
   tazesi geldiğinde sessizce değiştirilir. */
const onGoruntu={}, onZaman={}, onIstek={};   /* onIstek: yolda olanlar */
let onIsitildi=false;

function onizlemeAdres(c){
  const kok=String(c.base||CFG.base||"").replace(/\/+$/,"");
  const kam=c.cam!==undefined?c.cam:CFG.cam;
  if(!kok||kam===undefined)return null;
  const kul=c.user!==undefined?c.user:CFG.user;
  const par=c.pass!==undefined?c.pass:CFG.pass;
  const akis=c.stream!==undefined?c.stream:CFG.stream;
  return kok+"/cameras/"+kam+"/image?stream="+encodeURIComponent(akis||"sub")+
    "&authorization="+encodeURIComponent("Basic "+b64(kul+":"+par))+"&t="+Date.now();
}
/* Belleğe al; kutu verilirse geldiğinde oraya yerleştir. Aynı kamera için
   yolda bir istek varsa ikincisi açılmaz, sadece hedef kutu güncellenir. */
function onizlemeGetir(i,c,kutu){
  if(onIstek[i]){if(kutu)onIstek[i].kutu=kutu;return}
  const u=onizlemeAdres(c);if(!u)return;
  const img=new Image(), kayit={img,kutu:kutu||null};
  onIstek[i]=kayit;
  img.decoding="async";
  img.onload=()=>{
    delete onIstek[i];
    onGoruntu[i]=img;onZaman[i]=Date.now();
    const k=kayit.kutu;
    if(k&&k.isConnected){
      k.querySelectorAll("img").forEach(x=>{if(x!==img)x.remove()});
      k.appendChild(img);
      requestAnimationFrame(()=>img.classList.add("yuklendi"));
    }
  };
  img.onerror=()=>{delete onIstek[i]};        /* alınamazsa ikon kalır */
  img.src=u;
}
/* listede göster: bellektekini hemen bas, gerekiyorsa arkada tazele */
function onizlemeYukle(kutu,c,i){
  const eski=onGoruntu[i];
  if(eski){kutu.appendChild(eski);eski.classList.add("yuklendi")}
  const taze=Date.now()-(onZaman[i]||0) < (+CFG.onizlemeTazeMs||20000);
  if(!eski||!taze)onizlemeGetir(i,c,kutu);
}
/* önden ısıt: açılışta bir kez ve seçiciye dokunulduğu anda */
function onizlemeIsit(hepsi){
  const L=KAMERALAR(), sinir=hepsi?L.length:Math.min(L.length,+CFG.onizlemeIsit||0);
  for(let i=0;i<sinir;i++){
    if(Date.now()-(onZaman[i]||0) < (+CFG.onizlemeTazeMs||20000))continue;
    onizlemeGetir(i,L[i],null);
  }
}
function camUI(){
  const cok=KAMERALAR().length>1;
  $("camBtn").style.display=cok?"":"none";
  $("camLbl").textContent=kameraAdi();
}
function openCam(){if(clip||preparing)return;camListe();$("camModal").classList.add("on");idle(false)}
function closeCam(){$("camModal").classList.remove("on")}
function kameraSec(i){
  closeCam();
  if(clip||preparing)return;                  /* süren kaydı ortada bırakma */
  if(i===AK||i<0||i>=KAMERALAR().length)return;
  AK=i;kamNesil++;rpcMesgul=false;akisZorla=null;             /* yoldaki istekler geçersiz sayılır */
  BASE=String(K("base")||"").replace(/\/+$/,"");
  /* kamera değişti: önceki kameraya ait her şey bırakılır */
  exitPreview();shotClose();killHls();releaseSeg();prepClear();prefetchAbort();
  rangeCache={};kapsanan=[];sonBirim=0;rpcTavan=0;rpcYok=false;rpcHata="";sonPencere="";
  rangesDegisti();
  video.poster=kapakGorseli();
  camUI();resetView();goLive();draw();sunucuSaati();
}
$("camBtn").addEventListener("pointerdown",()=>{if(!clip&&!preparing)onizlemeIsit(true)});
$("camBtn").onclick=openCam;
$("camClose").onclick=closeCam;
$("camModal").addEventListener("pointerdown",e=>{if(e.target===$("camModal"))closeCam()});

$("dayBtn").onclick=openDay;
$("mClose").onclick=closeDay;
$("dayModal").addEventListener("pointerdown",e=>{if(e.target===$("dayModal"))closeDay()});
$("mPrev").onclick=()=>setDay(new Date(+day-864e5));
$("mNext").onclick=()=>setDay(new Date(+day+864e5));
$("mToday").onclick=()=>{setDay(new Date());closeDay()};
$("mYest").onclick=()=>{setDay(new Date(Date.now()-864e5));closeDay()};

/* ---------- kontroller ---------- */
$("btnPlay").onclick=()=>video.paused?play():video.pause();
const ICON_PLAY="M8 5.5v13l11-6.5z", ICON_PAUSE="M8 5h3.2v14H8zM12.8 5H16v14h-3.2z";
const setPlayIcon=p=>$("icPlay").firstElementChild.setAttribute("d",p?ICON_PLAY:ICON_PAUSE);
video.addEventListener("play",()=>setPlayIcon(false));
video.addEventListener("pause",()=>setPlayIcon(true));
const syncMute=()=>{
  const kapali=video.muted||!video.volume;
  $("icVolOn").style.display=kapali?"none":"";
  $("icVolOff").style.display=kapali?"":"none";
};
$("btnMute").onclick=()=>{video.muted=!video.muted;syncMute()};
$("vol").oninput=e=>{video.volume=+e.target.value;video.muted=!+e.target.value;syncMute()};
$("rate").onchange=e=>video.playbackRate=+e.target.value;
/* iOS Safari Element.requestFullscreen desteklemez; orada CSS ile tam ekran taklidi */
function goFull(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(P.classList.contains("fs")){P.classList.remove("fs");requestAnimationFrame(fit);return}
  if(P.requestFullscreen)P.requestFullscreen().catch(()=>{P.classList.add("fs");fit()});
  else if(P.webkitRequestFullscreen)P.webkitRequestFullscreen();
  else{P.classList.add("fs");requestAnimationFrame(fit)}
}
$("btnFs").onclick=goFull;
document.addEventListener("fullscreenchange",()=>requestAnimationFrame(fit));
/* Canlıya dönüş: tünel geride kaldıysa doğrudan sıçramak yerine kayarak gider.
   Hedef sürekli ilerlediği için her karede yeniden hesaplanır. */
let kayan=false;
function canliyaKay(){
  if(mode==="live"){goLive();return}
  const bas=focus, uzaklik=Math.abs(canliAn()-bas);
  if(uzaklik<30){focus=canliAn();goLive();draw();return}       /* zaten uçtaysa kaydırma */
  const sure=clamp(260+Math.log10(1+uzaklik)*180,260,760);      /* uzak mesafe biraz daha uzun */
  const t0=performance.now();
  kayan=true;
  const adim=t=>{
    if(!kayan)return;                                           /* kullanıcı devraldı */
    const p=Math.min(1,(t-t0)/sure);
    const e=p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;            /* yumuşak giriş-çıkış */
    focus=bas+(canliAn()-bas)*e;
    draw();
    if(p<1)requestAnimationFrame(adim);
    else{kayan=false;focus=canliAn();goLive();draw()}
  };
  requestAnimationFrame(adim);
}
$("btnLive").onclick=canliyaKay;
/* düğme canlıdayken durum göstergesi, gerideyken eylem */
function canliBtnUI(){
  $("liveLbl").textContent = mode==="live" ? "CANLI" : "CANLIYA DÖN";
}
$("cBtn").onclick=()=>{hideCenter();if(mode==="live")goLive()};

/* ---------- otomatik gizleme ---------- */
let idleT=null, touchUI=false;
function idle(on){
  /* canlıda klip yok; kayıtta klip alırken de gizlenir, tünel ve baloncuk açık kalır */
  if(on){if(!video.paused&&(mode==="rec"||!clip))P.classList.add("idle");return}
  P.classList.remove("idle");clearTimeout(idleT);
  idleT=setTimeout(()=>{
    if(!video.paused&&!dg&&!$("dayModal").classList.contains("on"))idle(true);
  },touchUI?2600:1800);
}
["pointermove","pointerdown","pointerup","keydown","wheel"].forEach(ev=>
  P.addEventListener(ev,e=>{if(e.pointerType)touchUI=e.pointerType!=="mouse";idle(false)},{passive:true}));
/* dokunmatikte parmak kalkınca pointerleave tetiklenir; sadece fare için geçerli olsun */
P.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!video.paused)idle(true)});
video.addEventListener("pause",()=>idle(false));

document.addEventListener("keydown",e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(P.classList.contains("shooting")){          /* işaretleme ekranı açıkken */
    if(e.key==="Escape")shotClose();
    else if((e.ctrlKey||e.metaKey)&&e.key==="z")geriAl();
    return;
  }
  if(e.code==="Space"){e.preventDefault();video.paused?play():video.pause()}
  else if(/^[mM]$/.test(e.key)){video.muted=!video.muted;syncMute()}
  else if(/^[fF]$/.test(e.key))$("btnFs").click();
  else if(/^[rR]$/.test(e.key))clipToggle();
  else if(e.key==="Escape"){if(P.classList.contains("preview"))exitPreview();else closeDay()}
  /* kayıt ve hazırlık sırasında sarma işaretin sınırlarını bozar */
  else if(e.key==="ArrowLeft"){if(!clip&&!preparing)video.currentTime=Math.max(0,video.currentTime-10)}
  else if(e.key==="ArrowRight"){if(!clip&&!preparing)video.currentTime+=10}
});

/* ---------- ekranı açık tut ---------- */
/* Maç izlerken ekrana dokunulmadığı için telefon karartıyor. Oynatma sürerken
   kilidi tutar, duraklayınca ya da sekme arkaya alınınca bırakır. */
let wake=null;
async function wakeOn(){
  if(wake||!("wakeLock" in navigator)||document.visibilityState!=="visible")return;
  try{
    wake=await navigator.wakeLock.request("screen");
    wake.addEventListener("release",()=>{wake=null});
  }catch(e){wake=null}
}
function wakeOff(){ if(wake){try{wake.release()}catch(e){} wake=null} }
video.addEventListener("playing",wakeOn);
video.addEventListener("pause",wakeOff);
video.addEventListener("ended",wakeOff);

/* ---------- arka plandan dönüş ---------- */
/* Sekme arkadayken canlı yayın donuyor ya da dakikalarca geride kalıyor.
   Geri dönüldüğünde canlı uca yaklaştırılır, gerekirse akış yeniden kurulur. */
let hidAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"){hidAt=Date.now();wakeOff();return}
  const away=(Date.now()-hidAt)/1000;
  if(!video.paused)wakeOn();
  if(mode!=="live")return;
  if(away>90||video.readyState<2||video.error){goLive();return}   /* uzun süre: baştan kur */
  if(hls){
    try{
      const edge=hls.liveSyncPosition;
      if(edge!=null&&isFinite(edge)&&edge-video.currentTime>6)video.currentTime=edge;
    }catch(e){}
    hls.startLoad();
  }else if(video.buffered.length){                                 /* Safari yerel HLS */
    const end=video.buffered.end(video.buffered.length-1);
    if(end-video.currentTime>6)video.currentTime=end-1;
  }
  play();
});

/* ---------- dikey mod uyarısı ---------- */
const mqPortrait=matchMedia("(orientation: portrait)");
const isTouch=()=>matchMedia("(pointer: coarse)").matches;
let wasPlaying=false;
function checkOrient(){
  const need=CFG.landscape&&isTouch()&&mqPortrait.matches;
  $("rotate").classList.toggle("on",need);
  if(need){
    if(!video.paused){wasPlaying=true;video.pause()}
    clipCancel();
  }else if(wasPlaying){wasPlaying=false;play()}
}
mqPortrait.addEventListener?mqPortrait.addEventListener("change",checkOrient)
                           :mqPortrait.addListener(checkOrient);
addEventListener("orientationchange",()=>setTimeout(checkOrient,120));
$("rotBtn").onclick=async()=>{
  try{goFull()}catch(e){}
  try{await screen.orientation.lock("landscape")}catch(e){}   /* iOS desteklemez, sessizce geçilir */
  setTimeout(checkOrient,300);
};

/* ---------- başlat ---------- */
$("dayLbl").textContent=kisaTarih(day);$("day").value=dISO(day);
video.volume=1;syncMute();selUI();fit();resetView();tick();goLive();idle(false);checkOrient();camUI();sunucuSaati();tazeleBaslat();
setTimeout(()=>{if(!onIsitildi){onIsitildi=true;onizlemeIsit(false)}},2500);   /* yayın oturduktan sonra */
