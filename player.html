<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root{
    --ink:#eef2f7; --dim:#a6b2c2; --faint:#6b7787;
    --line:rgba(255,255,255,.14); --fill:rgba(255,255,255,.09); --fill-h:rgba(255,255,255,.17);
    /* Yüzen katmanlar (baloncuk, menü, palet) ortak dil kullanır; ok üçgeninin
       iç rengi bunun opak karşılığıdır. */
    --pop:rgba(12,17,25,.92); --pop-ok:#0c1119; --pop-rad:12px;
    --pop-bosluk:2px;          /* okun ucu ile gösterdiği şey arasındaki mesafe */
    --pop-golge:0 8px 24px rgba(0,0,0,.5);
    --amber:#f0a13c; --live:#3ecf8e; --sel:#4aa8ff; --danger:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05080d}
  body{font-family:var(--sans);color:var(--ink);overflow:hidden}

  #player{position:relative;width:100%;height:100dvh;background:#05080d;overflow:hidden;user-select:none;
    touch-action:none}
  #player:fullscreen{height:100vh}
  #player.fs{position:fixed;inset:0;width:100%;height:100dvh;z-index:999}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05080d;display:block;
    touch-action:none}

  /* şeritler bilgi katmanının (z:3) üstünde kalmalı, yoksa tünel altında gizlenir */
  .scrim{position:absolute;left:0;right:0;z-index:4;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
  .scrim>*{pointer-events:auto}
  .scrim-t{top:0;padding:10px 12px;display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,rgba(3,6,11,.88),rgba(3,6,11,0))}
  .scrim-b{bottom:0;padding:26px 12px 12px}
  .scrim-b::before{content:"";position:absolute;left:0;right:0;bottom:0;height:132px;z-index:-1;
    pointer-events:none;
    background:linear-gradient(0deg,rgba(3,6,11,.94),rgba(3,6,11,.82) 38%,rgba(3,6,11,0))}
  #player.idle{cursor:auto}
  #player.idle .scrim{opacity:1;transform:none}
  #player.idle .ctrl{opacity:0;pointer-events:none;margin-bottom:-44px}

  .pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;
    border:1px solid var(--line);background:rgba(10,15,23,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-radius:9px;color:var(--ink);font:13px/1 var(--sans);cursor:pointer;
    transition:background .14s,border-color .14s;white-space:nowrap}
  .pill:hover{background:var(--fill-h)}
  .pill:active{transform:translateY(1px)}
  .pill:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
  .pill[disabled]{opacity:.35;pointer-events:none}
  .pill.sq{width:32px;padding:0;justify-content:center;font-size:15px}
  .pill.go{background:var(--sel);border-color:var(--sel);color:#06121e;font-weight:650}
  .pill.go:hover{background:#65b7ff}
  .pill.busy{border-color:var(--amber);color:var(--amber)}
  /* Menü düğmeleri: içi dolu değil, hafif renkli zemin — kaydı durdur
     düğmesiyle aynı dil. */
  .ses-menu .pill.go{background:rgba(74,168,255,.16);border-color:rgba(74,168,255,.55);
    color:#bfe0ff;font-weight:600}
  .ses-menu .pill.go:hover{background:rgba(74,168,255,.26)}
  .pill.sil{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.55);color:#ffc0c0}
  .pill.sil:hover{background:rgba(255,107,107,.26);border-color:rgba(255,107,107,.7)}
  .sp{margin-left:auto}

  .seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;
    background:rgba(10,15,23,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .seg button{border:0;background:transparent;color:var(--dim);font:600 12.5px/1 var(--sans);
    padding:7px 12px;border-radius:7px;cursor:pointer;letter-spacing:.02em}
  .seg button[aria-selected="true"]{background:var(--fill-h);color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}

  #player.kilit #dayBtn,#player.kilit #btnLive,#player.kilit #camBtn{opacity:.35;pointer-events:none}
  #camBtn{gap:7px;max-width:170px}
  #camLbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* kamera kartları: yan yana ızgara, görüntü büyük, yazı altında */
  .ck-bilgi{display:flex;flex-direction:column;gap:6px;margin:0 0 13px;font-size:12.5px;color:var(--dim)}
  .ck-bilgi div{display:flex;justify-content:space-between;gap:14px}
  .ck-bilgi b{font-weight:600;color:var(--ink);font-family:var(--mono);font-size:12px}
  .ck-cubuk{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:13px}
  .ck-dolgu{height:100%;width:0;border-radius:3px;background:var(--sel);transition:width .22s}
  #ciktiModal.hazir .ck-cubuk{display:none}
  #ckDo{opacity:.35;pointer-events:none}
  #ciktiModal.hazir #ckDo{opacity:1;pointer-events:auto}
  /* Kaydırma çubuğu dinle düğmesinin üstüne binmesin: sağda pay bırakılır
     ve çubuk ince, kendi rengiyle çizilir. */
  .ses-list{display:flex;flex-direction:column;gap:7px;margin:2px 0 12px;
    max-height:54vh;overflow-y:auto;overflow-x:hidden;padding-right:8px;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
  .ses-list::-webkit-scrollbar{width:6px}
  .ses-list::-webkit-scrollbar-track{background:transparent}
  .ses-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}
  .ses-list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.34)}
  .ses-satir{display:flex;gap:6px}
  .ses-din{flex:none;width:42px;display:grid;place-items:center;cursor:pointer;
    border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);
    color:var(--dim);transition:background .14s,color .14s}
  .ses-din:hover{background:rgba(255,255,255,.09);color:var(--ink)}
  .ses-din.caliyor{background:rgba(74,168,255,.18);border-color:rgba(74,168,255,.5);color:var(--sel)}
  .ses-din.hatali{border-color:rgba(255,107,107,.6);color:#ffb3b3}
  .ses-din.yukleniyor .ic{display:none}
  .ses-din.yukleniyor::before{content:"";width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(255,255,255,.22);border-top-color:currentColor;
    animation:donuyor .8s linear infinite}
  .ses-sec{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;
    border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);
    color:var(--ink);font:inherit;text-align:left;font-weight:600;font-size:13.5px;
    transition:background .14s}
  .ses-sec:hover{background:rgba(255,255,255,.09)}
  .ses-sec.yukleniyor{opacity:.6;pointer-events:none}
  .ses-sec.yukleniyor .ic{display:none}
  .ses-sec.yukleniyor::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.22);border-top-color:currentColor;
    animation:donuyor .8s linear infinite}
  .ses-sec.hatali{border-color:rgba(255,107,107,.6);color:#ffb3b3}
  @keyframes donuyor{to{transform:rotate(360deg)}}
  .ses-sec .ic{flex:none;color:var(--dim)}
  /* işaretler ilerleme çubuğunda */
  /* İşaret artık bir nokta değil, sesin süresi kadar bant. Sol kenar başlangıcı
     gösterir; sürükleme o kenarı taşır. */
  /* Bant çubuğun altından geçerken alt ve üstte az görünüyordu; biraz
     yükseltildi. Üstte kalan pay baloncuk okunun 2px'lik mesafesini bozmayacak
     kadar bırakılır. */
  .ses-im{position:absolute;top:50%;min-width:3px;height:17px;margin-top:-8.5px;
    border-radius:3px;background:rgba(255,214,10,.34);
    border-left:3px solid #ffd60a;box-sizing:border-box;
    box-shadow:0 0 0 1px rgba(0,0,0,.45);
    cursor:grab;z-index:2;touch-action:none}
  /* görünmez geniş dokunma alanı: ince işaret parmakla da yakalanır */
  .ses-im::after{content:"";position:absolute;left:-11px;top:50%;
    width:26px;height:26px;transform:translateY(-50%)}
  .ses-ad{position:absolute;left:5px;right:3px;top:50%;transform:translateY(-50%);
    font-size:9.5px;font-weight:700;line-height:1;letter-spacing:.01em;
    color:#fff3c4;text-shadow:0 1px 2px rgba(0,0,0,.85);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
  .ses-im.dar .ses-ad{display:none}
  .ses-im.yalniz-onizleme .ses-ad{color:#ffe0bd}
  .ses-im.tasiniyor{cursor:grabbing;height:21px;margin-top:-10.5px;
    background:rgba(255,255,255,.4);border-left-color:#fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(255,214,10,.8)}
  .ses-im:hover{background:rgba(255,255,255,.45)}
  /* işaretli alana dokununca çıkan seçenekler */
  .ses-menu{position:absolute;bottom:calc(100% + var(--pop-bosluk) + 5px);z-index:5;display:none;gap:6px;
    padding:5px;border-radius:var(--pop-rad);transform:translateX(-50%);
    background:var(--pop);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:var(--pop-golge);white-space:nowrap}
  .ses-menu.on{display:flex}
  .ses-menu .pill{height:32px;padding:0 12px;gap:6px}
  /* ok da baloncuk gibi çerçeveli görünsün: arkada bir tık büyük, çizgi
     renginde ikinci bir üçgen. */
  .ses-menu::before{content:"";position:absolute;top:100%;left:var(--ok,50%);margin-left:-6.5px;
    border-left:6.5px solid transparent;border-right:6.5px solid transparent;
    border-top:6px solid var(--line)}
  .ses-menu::after{content:"";position:absolute;top:calc(100% - 1px);left:var(--ok,50%);margin-left:-6px;
    border-left:6px solid transparent;border-right:6px solid transparent;
    border-top:6px solid var(--pop-ok)}
  /* sunucu izni olmadığı için klibe gömülemeyen ses */
  .ses-im.yalniz-onizleme{background:rgba(255,149,0,.32);border-left-color:#ff9500}
  .cam-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:2px 0 12px;
    max-height:56vh;overflow-y:auto;overflow-x:hidden;padding-right:8px;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
  .cam-list::-webkit-scrollbar{width:6px}
  .cam-list::-webkit-scrollbar-track{background:transparent}
  .cam-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}
  .cam-sec{display:block;padding:0;cursor:pointer;overflow:hidden;
    border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);
    color:var(--ink);font:inherit;text-align:left;transition:background .14s,border-color .14s}
  .cam-sec:hover{background:rgba(255,255,255,.09)}
  .cam-sec.on{border-color:var(--sel);background:rgba(74,168,255,.14)}
  .cam-sec.on .cam-on::after{content:"";position:absolute;top:6px;right:6px;
    width:9px;height:9px;border-radius:50%;background:var(--sel);
    box-shadow:0 0 0 2px rgba(5,8,13,.75)}
  /* anlık görüntü: yüklenene kadar ikon görünür */
  .cam-on{position:relative;width:100%;aspect-ratio:16/9;
    background:rgba(0,0,0,.45);overflow:hidden;display:grid;place-items:center}
  .cam-on img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .25s}
  .cam-on img.yuklendi{opacity:1}
  .cam-sec .ic{width:22px;height:22px;color:var(--dim)}
  .cam-sec.on .ic{color:var(--sel)}
  .cam-ad{display:block;min-width:0;padding:8px 10px 9px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-weight:600;font-size:13px}
  .cam-alt{font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:400;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* tek kamera ya da dar ekran: tek sütun */
  @media(max-width:380px){.cam-list{grid-template-columns:1fr}}
  .canli-btn{font-weight:700;letter-spacing:.06em;font-size:12.5px}
  #player.canli .canli-btn{background:rgba(62,207,142,.18);border-color:rgba(62,207,142,.5);
    color:#b8f5d8;pointer-events:none;font-weight:700;letter-spacing:.06em}
  #player.canli #liveDot{background:var(--live);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.on{background:var(--live);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
  .dot.busy{background:var(--amber);box-shadow:0 0 0 3px rgba(240,161,60,.18);animation:pulse 1.1s infinite}
  .dot.err{background:var(--danger);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
  @keyframes pulse{50%{opacity:.35}}

  .tc{font-family:var(--mono);font-size:12.5px}
  #stamp{color:var(--amber);font-family:var(--mono);font-size:13px}

  select.pill{appearance:none;padding-right:22px;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 12px) 14px,calc(100% - 8px) 14px;background-size:4px 4px;background-repeat:no-repeat}
  input[type=date].pill{cursor:text;font-family:var(--mono);font-size:12.5px}
  input[type=range]{accent-color:var(--sel);width:80px;height:32px}

  #tl{flex-direction:column;gap:4px;margin-bottom:10px;position:relative}
  #tl{display:flex}
  .tlbar{display:flex;align-items:center;gap:6px;min-height:42px;max-height:60px;
    transition:opacity .18s,min-height .26s,max-height .26s}
  #timeline{width:100%;height:78px;display:block;border-radius:10px;cursor:grab;touch-action:none;
    background:rgba(8,12,19,.62);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:height .26s}
  /* Boşta: tünel ince bir şeride iner, üzerinde yalnızca saatler ve kayıt bandı
     kalır. Kamera/tarih/canlı düğmeleri katlanır. */
  #player.idle .tlbar{opacity:0;pointer-events:none;min-height:0;max-height:0;
    overflow:hidden;margin:0}
  #player.idle #timeline{height:38px}
  /* Boşta baloncuk kalır: ani bir an için kaydı hemen başlatabilmek gerekiyor.
     Üst şerit katlandığı için görüntünün üzerine yükselir. */
  /* Okun ucu her iki durumda da tünelin üst kenarına değsin. Hesap:
     tünelin üstü = üst şerit yüksekliği + 4px aralık; baloncuk 42px + ok 6px.
     Normalde şerit 42px (üst = 46 → top -2), boşta şerit katlanır (üst = 4 → top -44). */
  #bubble{top:calc(-2px - var(--pop-bosluk))}
  #player.idle #bubble{top:calc(-44px - var(--pop-bosluk))}
  #bubble{transition:top .26s}
  @media(prefers-reduced-motion:reduce){
    .tlbar,#timeline{transition:none}
  }

  #bubble{position:absolute;left:0;display:none;align-items:center;gap:6px;height:42px;
    transform:translateX(-50%);padding:5px;border-radius:var(--pop-rad);
    background:var(--pop);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:var(--pop-golge);white-space:nowrap;z-index:2}
  #bubble.on{display:flex}
  /* Ok çerçevesi yalnızca eğik kenarlarda görünsün: dış üçgen sadece yanlardan
     geniş, derinliği aynı. Aksi halde ucunda da beyaz kalıyor ve baloncuk
     boşlukta dururken (tünel küçükken) her kenarı çizgili görünüyordu. */
  /* Çerçeve üçgeni baloncuğun kenarıyla aynı renkte ve yalnızca yarım piksel
     taşar: tam piksel taşınca eğik kenarda kalın bir kama oluşup gövdenin
     ince çizgisinden daha belirgin duruyordu. */
  #bubble::before{content:"";position:absolute;top:100%;left:var(--arrow,50%);transform:translateX(-50%);
    border-left:6.5px solid transparent;border-right:6.5px solid transparent;
    border-top:6px solid var(--line)}
  /* İç üçgen 1px yukarıda: baloncuğun alt kenar çizgisi okun tabanından
     geçiyordu, bu şekilde tam altında kalıp gizleniyor. */
  #bubble::after{content:"";position:absolute;top:calc(100% - 1px);left:var(--arrow,50%);
    transform:translateX(-50%);
    border-left:6px solid transparent;border-right:6px solid transparent;
    border-top:6px solid var(--pop-ok)}    /* opak: saydam olsa alttaki çerçeve
      üçgeni içinden görünür ve okun tamamı çizgili durur */
  #selText{font-family:var(--mono);font-size:12px;color:var(--dim);padding:0 4px}
  #selText em{font-style:normal;color:var(--sel)}


  /* kayıt önizlemesi: zaman tünelinin yerini alır, ayrı bir ekran hissi verir */
  #preview{display:none;flex-direction:column;justify-content:space-between;
    min-height:78px;margin-bottom:10px;       /* tünel tuvaliyle birebir (border-box) */
    padding:9px 12px;border-radius:10px;
    background:rgba(9,13,20,.72);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  #player.preview #preview{display:flex}
  #player.preview #tl,#player.preview #bubble{display:none}
  .pv-head{display:flex;align-items:center;gap:8px}
  #pvBack,#pvShare,#pvDl{height:32px}
  #pvBack{width:32px}
  .pv-range{font-family:var(--mono);font-size:12.5px;color:var(--sel)}
  .pv-track{display:flex;align-items:center;gap:10px}
  .pv-t{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
  .pv-bar{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none;
    display:flex;align-items:center}
  .pv-bar::before{content:"";position:absolute;left:0;right:0;height:7px;border-radius:4px;
    background:rgba(255,255,255,.12)}
  .pv-fill{position:relative;height:7px;border-radius:4px;background:var(--sel);width:0;
    box-shadow:0 0 0 1px rgba(74,168,255,.25)}
  /* Tutamak, "Burayı seç" ikonuyla aynı biçim: dış halka + ortada nokta.
     Aynı şeyi anlatan iki öğe aynı görünsün. */
  .pv-fill::after{content:"";position:absolute;right:-8px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle,var(--sel) 0 3.2px,var(--pop-ok) 3.2px 5.6px,var(--sel) 5.6px 100%);
    box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .pv-size{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
  /* tüm ikonlar SVG: cihazdan cihaza görünüm değişmez */
  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .ic.fill{fill:currentColor;stroke:none}
  .pill.sq .ic{width:17px;height:17px}
  #dayBtn .ic{width:15px;height:15px;margin-right:1px}
  #pvShare,#pvDl,#mPrev,#mNext,#dayBtn{gap:7px}
  @media(max-width:620px){#pvShare span,#pvDl span{display:none}
    #pvShare,#pvDl{width:38px;padding:0;justify-content:center}
    #preview{min-height:66px;padding:6px 10px}
    .pv-bar{height:18px}
    .ses-im{height:14px;margin-top:-7px}
    .ses-im.tasiniyor{height:17px;margin-top:-8.5px}}

  .ctrl{display:flex;align-items:center;gap:6px;
    transition:opacity .22s ease,margin-bottom .22s ease}
  .ctrl .tc{color:var(--dim);padding:0 2px;white-space:nowrap}
  .ctrl .tc b{color:var(--ink);font-weight:500}

  .rdot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:none;opacity:.65}
  #btnClip{font-variant-numeric:tabular-nums}
  #btnClip.on{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.55);color:#ffc0c0}
  #btnClip.on .rdot{opacity:1;border-radius:2px;animation:pulse 1s infinite}
  /* hazırlanırken düğme pasifleşir, dolgu ilerlemeyi gösterir */
  #btnClip.prep{pointer-events:none;color:var(--dim);border-color:rgba(74,168,255,.45);
    background:linear-gradient(90deg,rgba(74,168,255,.28) var(--p,0%),rgba(10,15,23,.55) var(--p,0%));
    transition:background .12s linear}
  /* kayıt sırasındaki nabız yerine dönen halka: aynı yerde, aynı boyutta */
  #btnClip.prep .rdot{background:none;opacity:1;border-radius:50%;
    width:12px;height:12px;border:2px solid rgba(74,168,255,.3);border-top-color:var(--sel);
    animation:sp .7s linear infinite}

  /* baloncuk iki durumda: boşta (kaydı başlat) · kayıtta (durdur + başlangıç saati) */
  #bubble.idle #selText{display:none}
  #bubble.prep #selText{display:inline}
  #bubble.notready #btnClip{opacity:.45;pointer-events:none}
  #pvShare{font-variant-numeric:tabular-nums}
  #player.noshare #pvShare{display:none}

  /* dikey mod uyarısı */
  #rotate{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:28px;
    text-align:center;background:#05080d}
  #rotate.on{display:grid}
  #rotate h3{margin:22px 0 8px;font-size:17px;font-weight:600}
  #rotate p{margin:0 0 20px;color:var(--dim);font-size:14px;line-height:1.55;max-width:30ch}
  .phone{width:54px;height:90px;border:3px solid var(--amber);border-radius:10px;margin:0 auto;
    position:relative;animation:tilt 2.4s ease-in-out infinite;transform-origin:50% 50%}
  .phone::before{content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);
    width:16px;height:3px;border-radius:2px;background:var(--amber);opacity:.7}
  @keyframes tilt{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}

  /* ---- kare işaretleme: yatayda sol dikey ray ---- */
  #shot{position:absolute;inset:0;z-index:10;display:none;flex-direction:row;
    background:#05080d;padding:8px;gap:8px;--renk:#ff3b30}
  #shot.on{display:flex}
  /* overflow kullanılmaz: baloncuk rayın dışına taşıyor, kırpılır */
  .rail{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;
    max-height:100%;justify-content:center;position:relative}
  .rail>.tb-back{position:absolute;top:0;left:50%;transform:translateX(-50%)}
  .stagewrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
  /* alt şerit: kırpma onayı ve çıktı düğmeleri aynı yeri, aynı ölçüyü paylaşır */
  .altserit{position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:flex;align-items:center;gap:10px;padding:14px 12px 12px;
    background:linear-gradient(0deg,rgba(3,6,11,.9),rgba(3,6,11,.55) 60%,rgba(3,6,11,0))}
  .altserit .pill{height:36px;gap:7px;padding:0 14px}
  #ciktiBar{justify-content:flex-end}
  #player.cropping #ciktiBar{display:none}

  .tb{display:flex;align-items:center;gap:2px;padding:3px;border-radius:12px;
    background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .tb.col{flex-direction:column}
  .tb-sep{width:20px;height:1px;background:var(--line);margin:3px 0}
  .tb button{width:36px;height:36px;display:grid;place-items:center;cursor:pointer;
    border:0;background:transparent;color:var(--dim);border-radius:9px;
    transition:background .14s,color .14s,transform .1s}
  .tb button:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .tb button:active{transform:scale(.92)}
  .tb button:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
  .tool.on{background:rgba(255,255,255,.14);color:var(--ink)}
  .tool.on .ic{stroke:var(--renk)}            /* etkin araç seçili rengi taşır */
  .tb-act[disabled]{opacity:.3;pointer-events:none}
  .tb-act.go{background:var(--sel);color:#06121e}
  .tb-act.go:hover{background:#65b7ff;color:#06121e}
  .tb-back{width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
    border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.06);
    color:var(--ink);flex:none}
  .tb-back:hover{background:rgba(255,255,255,.12)}

  /* renk paleti: araç kümesinin sağında dikey baloncuk */
  .tool-wrap{position:relative;display:flex}
  /* Palet, araç kümesini saran çerçeveye tutunuyor; düğmenin kendisi 4px
     içeride (3px iç boşluk + 1px kenar). Mesafe düğmeden ölçülsün diye eklenir,
     yoksa öteki baloncuklardan daha yakın görünüyor. */
  .palet{position:absolute;left:calc(100% + var(--pop-bosluk) + 5px + 4px);top:0;z-index:3;
    display:none;flex-direction:column;align-items:center;gap:10px;
    padding:11px;border-radius:var(--pop-rad);
    background:var(--pop);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:var(--pop-golge);
    animation:paletAc .16s ease}
  .palet.acik{display:flex}
  .palet::after{content:"";position:absolute;right:100%;top:var(--ok,20px);
    transform:translateY(-50%);transition:top .16s ease;
    border-top:6.5px solid transparent;border-bottom:6.5px solid transparent;
    border-right:6px solid var(--line)}
  .palet::before{content:"";position:absolute;right:calc(100% - 1px);top:var(--ok,20px);z-index:1;
    transform:translateY(-50%);transition:top .16s ease;
    border-top:6px solid transparent;border-bottom:6px solid transparent;
    border-right:6px solid var(--pop-ok)}
  @keyframes paletAc{from{opacity:0;transform:translateX(-6px)}}
  .sw{width:26px;height:26px;border-radius:50%;cursor:pointer;padding:0;flex:none;
    background:var(--c);border:1px solid rgba(255,255,255,.25);
    transition:transform .14s,box-shadow .14s}
  .sw:hover{transform:scale(1.08)}
  /* seçili renk büyümez; halka baloncuğun içinde kalacak şekilde içeri çizilir */
  .sw.on{box-shadow:inset 0 0 0 3px var(--pop-ok),0 0 0 2px var(--c)}
  .sw:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  #cropBar{display:none}
  #player.cropping #cropBar{display:flex}
  #cropApply{gap:7px}
  .crop-hint{font-size:12px;color:var(--dim)}
  #shotCv{flex:1;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;
    border-radius:8px;background:#05080d}
  @media(max-height:380px){                  /* çok alçak ekranlar: daha da sıkı */
    .tb button{width:28px;height:28px}
    .tb-back{width:30px;height:30px}
    .ic{width:15px;height:15px}
  }
  @media(max-height:430px){                  /* alçak yatay ekranlar */
    #shot{padding:6px;gap:6px}
    .tb button{width:32px;height:32px}
    .tb-back{width:34px;height:34px}
    .palet{gap:7px;padding:8px 7px}
    .sw{width:23px;height:23px}
  }

  .modal{position:absolute;inset:0;z-index:6;display:none;place-items:center;padding:20px;
    background:rgba(3,6,11,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .modal.on{display:grid}
  .sheet{width:min(360px,100%);background:rgba(14,19,28,.97);border:1px solid var(--line);
    border-radius:calc(var(--pop-rad) + 2px);padding:16px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .sheet h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
  .sheet input[type=date]{width:100%;height:40px;padding:0 12px;border-radius:9px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
    font:14px var(--mono);margin-bottom:10px}
  .sheet .row{display:flex;gap:8px;margin-bottom:8px}
  .sheet .row .pill{flex:1;justify-content:center;height:36px}

  .center{position:absolute;inset:0;z-index:3;display:none;place-items:center;padding:24px;text-align:center;
    background:rgba(3,6,11,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .center.on{display:grid}
  .center{padding-bottom:210px}
  .center h3{margin:14px 0 6px;font-size:16px;font-weight:600}
  .center p{margin:0 0 16px;max-width:42ch;color:var(--dim);font-size:13.5px;line-height:1.55}
  .spin{width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;
    animation:sp .8s linear infinite;margin:0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:620px){
    .scrim-t{padding:8px}.scrim-b{padding:22px 8px 8px}
    #vol{display:none}
    #timeline{height:66px}.pill{height:34px}.ctrl{gap:4px}
    #player.idle .ctrl{margin-bottom:-46px}
    #player.idle #timeline{height:34px}
    #player.idle #bubble{top:calc(-44px - var(--pop-bosluk))}
    #selText{display:none}
    .center{padding-bottom:230px}
  }
  @media(max-width:420px){.pill.sq{width:34px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="player" class="live">
  <video id="video" playsinline webkit-playsinline x-webkit-airplay="deny"
         disableremoteplayback controlslist="nodownload noremoteplayback"
         preload="none"></video>

  <div class="scrim scrim-t">
    <span class="pill" id="statPill" style="pointer-events:none"><i class="dot" id="dot"></i><span id="status">Hazır</span></span>
    <span class="sp"></span>
    <span class="pill" style="pointer-events:none"><span id="stamp">--:--:--</span></span>
  </div>

  <div class="center" id="center">
    <div>
      <div id="cIcon" class="spin"></div>
      <h3 id="cTitle">Bağlanıyor</h3>
      <p id="cText"></p>
      <button class="pill go" id="cBtn" style="height:36px">Yeniden dene</button>
    </div>
  </div>

  <div class="scrim scrim-b">
    <div id="tl">
      <div class="tlbar">
        <button class="pill" id="camBtn" title="Kamera seç"><svg viewBox="0 0 24 24" class="ic"><path d="M3 7h11v10H3zM14 10l7-3v10l-7-3"/></svg><span id="camLbl"></span></button>
        <button class="pill" id="dayBtn" title="Tarih seç"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="dayLbl"></span></button>
        <span class="sp"></span>
        <button class="pill canli-btn" id="btnLive" title="Canlı yayına dön">
          <i class="dot" id="liveDot"></i><span id="liveLbl">CANLIYA DÖN</span></button>
      </div>

      <div id="bubble">
        <span id="selText"></span>
        <button class="pill" id="btnClip" title="Kaydı başlat / durdur (R)"><i class="rdot"></i><span id="clipLbl">Kaydı Başlat</span></button>
      </div>
      <canvas id="timeline"></canvas>
    </div>

    <div id="preview">
      <div class="pv-head">
        <button class="pill sq" id="pvBack" title="Zaman tüneline dön"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="pv-range" id="pvRange"></span>
        <span class="pv-size" id="pvSize"></span>
        <span class="sp"></span>
        <button class="pill" id="pvShot" title="Kareyi işaretle"><svg viewBox="0 0 24 24" class="ic"><path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/><circle cx="12" cy="12" r="3.2"/></svg><span>Kare Yakala</span></button>
        <button class="pill" id="pvSes" title="Bu ana ses ekle"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9H4M17 9a4 4 0 0 1 0 6"/></svg><span>Ses Ekle</span></button>
        <button class="pill" id="pvShare"><svg viewBox="0 0 24 24" class="ic"><path d="M12 16V4M12 4 8 8M12 4l4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span>Paylaş</span></button>
        <button class="pill go" id="pvDl"><svg viewBox="0 0 24 24" class="ic"><path d="M12 4v12M12 16l-4-4M12 16l4-4M5 19h14"/></svg><span>İndir</span></button>
      </div>
      <div class="pv-track">
        <span class="pv-t" id="pvCur">00:00</span>
        <div class="pv-bar" id="pvBar"><div class="pv-fill" id="pvFill"></div>
          <div class="ses-menu" id="sesMenu">
            <button class="pill go" id="sesSec"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></svg><span>Burayı seç</span></button>
            <button class="pill sil" id="sesSil"><svg viewBox="0 0 24 24" class="ic"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg><span>Sil</span></button>
          </div>
        </div>
        <span class="pv-t" id="pvLen">00:00</span>
      </div>
    </div>

    <div class="ctrl">
      <button class="pill sq" id="btnPlay" title="Oynat / Duraklat"><svg viewBox="0 0 24 24" class="ic fill" id="icPlay"><path d="M8 5.5v13l11-6.5z"/></svg></button>
      <button class="pill sq" id="btnMute" title="Ses"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" stroke="none"/><g id="icVolOn"><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></g><g id="icVolOff"><path d="M17 9.5l4 5M21 9.5l-4 5"/></g></svg></button>
      <input type="range" id="vol" min="0" max="1" step=".05" value="1" title="Ses düzeyi">
      <span class="tc" id="clock">--:--:--</span>
      <span class="sp"></span>
      <select class="pill" id="rate" title="Hız">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
      </select>
      <button class="pill sq" id="btnFs" title="Tam ekran"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>

  <div id="rotate">
    <div>
      <div class="phone"></div>
      <h3>Cihazınızı yatay çevirin</h3>
      <p>Bu oynatıcı yatay modda çalışır. Telefonunuzu çevirin ya da aşağıdaki düğmeyi kullanın.</p>
      <button class="pill go" id="rotBtn" style="height:38px">Tam ekran ve çevir</button>
    </div>
  </div>

  <div id="shot">
    <div class="rail">
      <button class="tb-back" id="shotBack" title="Kapat"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button>

      <div class="tool-wrap">
        <div class="tb col">
          <button class="tool on" data-tool="pen" title="Kalem"><svg viewBox="0 0 24 24" class="ic"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
          <button class="tool" data-tool="arrow" title="Ok"><svg viewBox="0 0 24 24" class="ic"><path d="M5 19L19 5M19 5h-7M19 5v7"/></svg></button>
          <button class="tool" data-tool="circle" title="Daire"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8"/></svg></button>
          <button class="tool" data-tool="rect" title="Dikdörtgen"><svg viewBox="0 0 24 24" class="ic"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
          <span class="tb-sep"></span>
          <button class="tool" data-tool="crop" title="Kırp"><svg viewBox="0 0 24 24" class="ic"><path d="M7 2v15h15M2 7h15v15"/></svg></button>
        </div>

        <div class="palet" id="renkler">
          <button class="sw on" data-color="#ff3b30" style="--c:#ff3b30" title="Kırmızı"></button>
          <button class="sw" data-color="#ff9500" style="--c:#ff9500" title="Turuncu"></button>
          <button class="sw" data-color="#ffd60a" style="--c:#ffd60a" title="Sarı"></button>
          <button class="sw" data-color="#34c759" style="--c:#34c759" title="Yeşil"></button>
          <button class="sw" data-color="#4aa8ff" style="--c:#4aa8ff" title="Mavi"></button>
          <button class="sw" data-color="#c77dff" style="--c:#c77dff" title="Mor"></button>
          <button class="sw" data-color="#ffffff" style="--c:#ffffff" title="Beyaz"></button>
          <button class="sw" data-color="#0b0e13" style="--c:#0b0e13" title="Siyah"></button>
        </div>
      </div>

      <div class="tb col">
        <button class="tb-act" id="shotUndo" title="Geri al"><svg viewBox="0 0 24 24" class="ic"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 0 12h-1"/></svg></button>
        <button class="tb-act" id="shotClear" title="Tümünü sil"><svg viewBox="0 0 24 24" class="ic"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>
      </div>

    </div>

    <div class="stagewrap">
      <canvas id="shotCv"></canvas>
      <div class="altserit" id="ciktiBar">
        <button class="pill" id="shotShare"><svg viewBox="0 0 24 24" class="ic"><path d="M12 16V4M12 4 8 8M12 4l4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span>Paylaş</span></button>
        <button class="pill go" id="shotSave"><svg viewBox="0 0 24 24" class="ic"><path d="M12 4v12M12 16l-4-4M12 16l4-4M5 19h14"/></svg><span>Kaydet</span></button>
      </div>
      <div class="altserit" id="cropBar">
        <span class="crop-hint">Alanı sürükleyerek seçin</span>
        <span class="sp"></span>
        <button class="pill" id="cropCancel"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Vazgeç</span></button>
        <button class="pill go" id="cropApply"><svg viewBox="0 0 24 24" class="ic"><path d="M7 2v15h15M2 7h15v15"/></svg><span>Kırp</span></button>
      </div>
    </div>
  </div>

  <div class="modal" id="ciktiModal">
    <div class="sheet">
      <h3 id="ckBaslik">Klip hazırlanıyor</h3>
      <div class="ck-bilgi" id="ckBilgi"></div>
      <div class="ck-cubuk" id="ckCubuk"><div class="ck-dolgu" id="ckDolgu"></div></div>
      <div class="row">
        <button class="pill" id="ckClose">Kapat</button>
        <button class="pill go" id="ckDo"><svg viewBox="0 0 24 24" class="ic" id="ckIkon"><path d="M12 4v12M12 16l-4-4M12 16l4-4M5 19h14"/></svg><span id="ckEtiket">İndir</span></button>
      </div>
    </div>
  </div>

  <div class="modal" id="sesModal">
    <div class="sheet">
      <h3>Ses ekle</h3>
      <div id="sesList" class="ses-list"></div>
      <div class="row"><button class="pill go" id="sesClose">Kapat</button></div>
    </div>
  </div>

  <div class="modal" id="camModal">
    <div class="sheet">
      <h3>Kamera</h3>
      <div id="camList" class="cam-list"></div>
      <div class="row"><button class="pill go" id="camClose">Kapat</button></div>
    </div>
  </div>

  <div class="modal" id="dayModal">
    <div class="sheet">
      <h3>Tarih</h3>
      <input type="date" id="day">
      <div class="row">
        <button class="pill" id="mPrev"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg><span>Önceki</span></button>
        <button class="pill" id="mNext"><span>Sonraki</span><svg viewBox="0 0 24 24" class="ic"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="row">
        <button class="pill" id="mYest">Dün</button>
        <button class="pill" id="mToday">Bugün</button>
      </div>
      <div class="row"><button class="pill go" id="mClose">Kapat</button></div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ==================================================================
   YAYIN AYARLARI — düzenlenecek tek yer burasıdır
   ================================================================== */
const CFG = {
  /* Kamera listesi. Her satır kendi sunucusunu ve numarasını taşır; altındaki
     ortak ayarları (stream, user, pass) gerekirse kendi içinde ezebilir.
     Tek kamera bırakırsanız seçici düğme kendiliğinden gizlenir. */
  kameralar: [
    {ad:"Saha 1", alt:"Kale arkası", base:"https://cloud4.kamerabulutkayit.com", cam:"2"},
    {ad:"Saha 2", alt:"Yan çizgi",   base:"https://cloud1.kamerabulutkayit.com", cam:"4"}
  ],
  stream : "sub",                                  // "sub" (düşük) veya "main" (yüksek)
  yedekStream: "sub",                              // ana akış çözülemezse buna düşülür ("" = kapalı)
  user   : "admin",                                // Basic kimlik doğrulama kullanıcısı
  pass   : "",                                     // parola (boşsa admin: → YWRtaW46)

  audio    : true,        // adrese audio=1 eklensin mi
  seconds  : true,        // time parametresine saniye de yazılsın mı — klipler için önemli;
                          // sunucu saniyeyi kabul etmiyorsa false yapın (başlangıç dakikaya yuvarlanır)
  file     : "varsistemi.mp4",  // indirilen dosya adının kökü
  liveEsik : 30,          // tünelde "şimdi"ye bu kadar yakınsa canlı yayına geçilir (sn)
  canliGecikme: 6,        // canlı yayında canlı ucun kaç saniye gerisinde kalınacağı

const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0"),
      clamp=(v,a,b)=>v<a?a:v>b?b:v, P=$("player"), video=$("video");

const b64=s=>{const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const hms=s=>{s=Math.max(0,Math.round(s));return pad(s/3600|0)+":"+pad(s%3600/60|0)+":"+pad(s%60)};
const hm =s=>{s=Math.max(0,Math.round(s));return pad(s/3600|0)+":"+pad(s%3600/60|0)};
const dur2=s=>{s=Math.max(0,Math.round(s));const h=s/3600|0,m=s%3600/60|0,x=s%60;
  if(h)return h+" sa "+m+" dk";
  if(m)return x?m+" dk "+x+" sn":m+" dk";
  return x+" sn";};
const mb=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const kisaTarih=d=>pad(d.getDate())+" "+AYLAR[d.getMonth()];
const dISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const secOf=d=>d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
/* ===== mutlak zaman modeli =====
   Tüm zamanlar epoch saniyesi. Gün kavramı yalnızca etiketleme, tarama ve
   adres üretimi için türetilir; tünel gün sınırı tanımaz. */
const DAY=86400;
let saatFarki=0;                       /* sunucu saati ile cihaz saati arasındaki fark */
const nowSec=()=>Date.now()/1000+saatFarki;
const dateOf=t=>new Date(Math.round(t)*1000);
const dayStartOf=t=>{const d=dateOf(t);d.setHours(0,0,0,0);return Math.round(d.getTime()/1000)};
const todOf=t=>t-dayStartOf(t);                 /* gün içi saniye */
const hmsAbs=t=>hms(todOf(t));
const hmAbs=t=>hm(todOf(t));

/* Etkin kamera. Bir alan kameranın kendisinde tanımlıysa o, değilse CFG'deki
   ortak değer kullanılır. */
let AK=0;
const KAMERALAR=()=>CFG.kameralar&&CFG.kameralar.length
  ? CFG.kameralar
  : [{ad:CFG.title||"Kamera", base:CFG.base, cam:CFG.cam}];
const K=alan=>{const c=KAMERALAR()[AK]||{};return c[alan]!==undefined?c[alan]:CFG[alan]};
let BASE=String(K("base")||"").replace(/\/+$/,"");
const kameraAdi=()=>{const c=KAMERALAR()[AK]||{};return c.ad||("cam "+K("cam"))};

/* ---------- akış seçimi ve kodek ----------
   H.265 (HEVC) desteği tarayıcıya bağlı: Safari ve donanım desteği olan
   Chrome/Edge çözer, diğerleri çözemez. Oynatıcı bunu değiştiremez ama
   çözülemeyen bir akışta siyah ekranda bırakmak yerine yedek akışa geçer. */
let akisZorla=null;
const AKIS=()=>akisZorla||K("stream");
const hevcVar=(()=>{
  try{
    const t=['video/mp4; codecs="hvc1.1.6.L93.B0"','video/mp4; codecs="hev1.1.6.L93.B0"'];
    const v=document.createElement("video");
    return t.some(x=>(window.MediaSource&&MediaSource.isTypeSupported&&MediaSource.isTypeSupported(x))
      ||["probably","maybe"].includes(v.canPlayType(x)));
  }catch(e){return false}
})();
function akisYedegeDus(sebep){
  const yedek=CFG.yedekStream||"sub";
  if(!yedek||AKIS()===yedek)return false;      /* zaten yedekteyiz */
  akisZorla=yedek;
  stat((sebep||"Akış çözülemedi")+" · "+yedek+" akışına geçildi","err");
  if(mode==="live")goLive();
  else if(seg.st)load(seg.st.getTime()/1000,CFG.chunk);
  return true;
}
/* "fill" = ekranı tamamen kapla (oran bozulabilir) · "cover" = kırparak kapla
   · "contain" = tamamını sığdır (kenarlarda boşluk kalır) */
video.style.objectFit = ["fill","contain","cover"].includes(CFG.fit) ? CFG.fit : "cover";
try{video.disableRemotePlayback=true}catch(e){}   /* AirPlay'e aktarımı engelle */

/* kapak: verilmezse kamera adını taşıyan yerleşik bir görsel üretilir */
const kapakGorseli=()=> CFG.poster || "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">'+
  '<defs><radialGradient id="g" cx="50%" cy="45%" r="70%">'+
  '<stop offset="0%" stop-color="#141c28"/><stop offset="100%" stop-color="#05080d"/>'+
  '</radialGradient></defs>'+

  '<circle cx="614" cy="352" r="12" fill="#f0a13c" fill-opacity=".7"/>'+

  kameraAdi().replace(/[<>&]/g,"")+'</text></svg>');
video.poster=kapakGorseli();

/* ---------- adres üretimi ---------- */
const tParam=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+
  pad(d.getHours())+":"+pad(d.getMinutes())+(CFG.seconds?":"+pad(d.getSeconds()):"");

function url(o){  /* authorization elle kodlanır: boşluk %20 olmalı, + değil */
  const q=["authorization="+encodeURIComponent("Basic "+b64(K("user")+":"+K("pass")))];
  if(CFG.audio)q.push("audio=1");
  if(o.start!=null){                       /* epoch biçimi: yuvarlama derdi yok */
    q.push("start="+Math.floor(o.start));q.push("end="+Math.ceil(o.end));
  }else{
    if(o.time)q.push("time="+encodeURIComponent(o.time));
    if(o.dur)q.push("duration="+encodeURIComponent(o.dur));
  }
  if(o.dl){q.push("download=1");q.push("filename="+encodeURIComponent(o.name))}
  return BASE+"/cameras/"+K("cam")+"/streaming/"+AKIS()+"."+(o.live?"m3u8":"mp4")+"?"+q.join("&");
}
const liveUrl=()=>url({live:true});
const fname=(st,d)=>(CFG.file.replace(/\.mp4$/i,"")||"kayit")+"_"+dISO(st)+"_"+
  pad(st.getHours())+pad(st.getMinutes())+pad(st.getSeconds())+"_"+hms(d).replace(/:/g,"")+".mp4";
/* CFG.seconds kapalıysa time dakikaya yuvarlanır; kayıp olmasın diye
   başlangıç geriye çekilip aradaki fark süreye eklenir */
function recUrl(st,d,dl){
  if(CFG.urlMode==="epoch"){
    const a=st.getTime()/1000;
    return url({start:a,end:a+d,dl:!!dl,name:dl?fname(st,d):null});
  }
  let s=st, dur=d;
  if(!CFG.seconds && st.getSeconds()){     /* dakikaya yuvarlanıyorsa kayıp olmasın */
    s=new Date(st); s.setSeconds(0,0); dur=d+st.getSeconds();
  }
  return url({time:tParam(s),dur:hms(dur),dl:!!dl,name:dl?fname(s,dur):null});
}

/* ---------- durum ---------- */
let mode="live",hls=null,hlsHata=0,view={s:0,w:3600},seg={st:null,d:0},sel={a:null,b:null};
/* focus = tünelin ortasındaki an (mutlak saniye). day yalnızca etiket/modal için türetilir. */
let focus=nowSec(), day=dateOf(dayStartOf(focus));
const enErken=()=>nowSec()-(CFG.historyDays||30)*DAY;
/* Canlı yayının gösterdiği an, duvar saatinden birkaç saniye geridedir. */
function canliAn(){
  let g=CFG.canliGecikme||6;
  if(hls&&typeof hls.latency==="number"&&hls.latency>0&&hls.latency<120)g=hls.latency;
  return nowSec()-g;
}
const canliBolge=t=>t>=nowSec()-(CFG.liveEsik||30);
const sinirla=t=>clamp(t,enErken(),nowSec());
function syncDay(){
  const g=dateOf(dayStartOf(focus));
  if(+g===+day)return;
  day=g;$("day").value=dISO(day);$("dayLbl").textContent=kisaTarih(day);
}
function resetView(){
  const w=clamp(CFG.viewSpan||DAY,+CFG.minSpan||120,+CFG.maxSpan||DAY);
  focus=nowSec();
  view={w,s:CFG.centerPin?focus-w/2:focus-w*.65};
  syncDay();
}
resetView();
/* seg.ready olmadan video.currentTime bir önceki parçaya aittir; pin yanlış yerde görünür */
const head=()=>{
  if(mode!=="rec"||!seg.st)return null;
  const t0=seg.st.getTime()/1000;
  if(!seg.ready)return t0;
  const ct=video.currentTime||0;
  return t0+(seg.d!=null?Math.min(ct,seg.d):ct);   /* seg.d yoksa süresiz akış */
};

const stat=(t,k)=>{
  $("status").textContent=t;$("dot").className="dot"+(k?" "+k:"");
  $("statPill").style.display=t?"":"none";      /* boş durum: rozet gizlenir */
};
function center(title,text,btn,spin){
  $("cTitle").textContent=title;$("cText").textContent=text||"";
  $("cIcon").style.display=spin?"":"none";
  $("cBtn").style.display=btn?"":"none";if(btn)$("cBtn").textContent=btn;
  $("center").classList.add("on")}
const hideCenter=()=>$("center").classList.remove("on");
/* Düğme metnini yazarken textContent kullanmak içindeki ikonu da siliyordu;
   yalnızca etiket bölümü güncellenir. */
function btnYaz(el,m){
  const sp=el.querySelector("span");
  if(sp)sp.textContent=m; else el.textContent=m;
}
const btnOku=el=>{const sp=el.querySelector("span");return sp?sp.textContent:el.textContent};
const flash=(el,m)=>{const o=btnOku(el);btnYaz(el,m);setTimeout(()=>btnYaz(el,o),1100)};

/* ---------- canlı ---------- */
function goLive(){
  shotClose();P.classList.remove("preview");prepClear();clipCancel();prefetchAbort();
  sel.a=sel.b=null;restoreSpan();          /* önizlemeden çıkılıyor: işaret ve yakınlık kalmasın */
  killHls();mode="live";P.classList.add("canli");
  seg.st=null;$("rate").value="1";video.playbackRate=1;
  focus=sinirla(canliAn());
  center("Bağlanıyor","",null,true);stat("Bağlanıyor…","busy");
  const u=liveUrl();hlsHata=0;
  if(window.Hls&&Hls.isSupported()){
    const yukPolitika={maxLoadTimeMs:20000,maxTimeToFirstByteMs:8000,
      timeoutRetry:{maxNumRetry:5,retryDelayMs:500,maxRetryDelayMs:2000},
      errorRetry:{maxNumRetry:5,retryDelayMs:500,maxRetryDelayMs:2000}};
    hls=new Hls({
      enableWorker:true,                       /* çözümleme ana iş parçacığını meşgul etmesin */
      lowLatencyMode:false,                    /* düşük gecikme kovalamak takılma üretiyor */
      liveSyncDuration:CFG.canliGecikme||6,    /* canlı ucun bu kadar gerisinde kal */
      liveMaxLatencyDuration:Math.max(20,(CFG.canliGecikme||6)*4),
      maxLiveSyncPlaybackRate:1.08,            /* geride kalınca sessizce hızlanıp yetiş */
      maxBufferLength:20, maxMaxBufferLength:40,
      backBufferLength:60,                     /* seyrek tahliye: daha az duraklama */
      maxBufferHole:.5, nudgeMaxRetry:8,       /* küçük boşluklarda takılıp kalma */
      capLevelToPlayerSize:true,               /* ekrandan büyük çözünürlük indirilmez */
      manifestLoadPolicy:{default:yukPolitika},
      playlistLoadPolicy:{default:yukPolitika},
      fragLoadPolicy:{default:Object.assign({},yukPolitika,{maxLoadTimeMs:120000})}
    });
    hls.loadSource(u);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{hideCenter();stat("","on");play()});   /* CANLI rozeti zaten var */
    hls.on(Hls.Events.FRAG_BUFFERED,()=>{hlsHata=0});   /* akış düzeldi: sayaç sıfırlanır */
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){
        stat("Ağ hatası","err");
        hlsHata++;
        if(hlsHata>4){goLive();return}          /* üst üste hata: baştan kur */
        hls.startLoad();
      }
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){
        const kodek=/codec|incompatible|unsupported/i.test((d.details||"")+" "+((d.error&&d.error.message)||""));
        if(kodek&&akisYedegeDus("Bu kamera H.265 yayınlıyor olabilir"))return;
        stat("Çözücü hatası","err");
        try{hls.config.maxBufferLength=15;hls.config.maxMaxBufferLength=30}catch(e){}
        hls.recoverMediaError();                /* zayıf bağlantıda arabelleği küçült */
      }
      else{stat("Bağlanamadı","err");
        center("Canlı akış açılamadı","Sunucuya ulaşılamıyor ya da tarayıcı CORS nedeniyle engelliyor. Dosyanın başındaki CFG bloğunu kontrol edin.","Yeniden dene",false)}});
  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=u;video.addEventListener("loadedmetadata",()=>{hideCenter();stat("","on");play()},{once:true});
  }else{stat("Desteklenmiyor","err");center("HLS desteklenmiyor","Bu tarayıcı HLS oynatamıyor.",null,false)}
}
const killHls=()=>{if(hls){hls.destroy();hls=null}video.removeAttribute("src");video.load()};
const play=()=>video.play().then(wakeOn).catch(()=>{video.muted=true;syncMute();video.play().then(wakeOn).catch(()=>{})});

/* ---------- kayıt ---------- */
function goRec(){
  killHls();mode="rec";P.classList.remove("canli");
  seg.st=null;stat("Kayıt");
  idle(false);requestAnimationFrame(fit);setTimeout(fit,60);
  taraGorunen();
}
/* Tünel konumuna göre kaynak seç: uçtaysa canlı, gerideyse kayıt. */
function kaynakSec(t){
  if(canliBolge(t)){if(mode!=="live")goLive();return}
  if(mode==="live")goRec();
  if(!hasRec(t)){releaseSeg();stat("Bu anda kayıt yok","err");
    center("Bu anda kayıt yok","Zaman tünelini kaydırıp turuncu çizgiyi yeşil işaretli bir bölüme getirin.",null,false);return}
  load(t,CFG.chunk);
}
/* locked=true ise parça bitince sonrakine geçilmez (işaretli aralık oynatımı) */
function load(t,d,locked){
  t=sinirla(t);
  dropBlobUrl();killHls();
  if(!locked&&CFG.openStream){                    /* gezinme: süresiz akış, parça sınırı yok */
    seg={st:dateOf(t),d:null,locked:false,ready:false};
    center("Yükleniyor","",null,true);stat("Yükleniyor…","busy");
    sonKontrol=0;
    /* Arşiv sürekli mp4 olarak akar: segment üretimi beklenmediği için
       takılma olmaz, hls.js devreye girmez. */
    video.src=url({time:tParam(seg.st)});video.load();play();
    selUI();draw();return;
  }
  d=Math.max(1,Math.min(d,nowSec()-t));           /* klip: tam sınırlarıyla */
  seg={st:dateOf(t),d:Math.round(d),locked:!!locked,ready:false};
  center("Yükleniyor","",null,true);stat("Yükleniyor…","busy");
  video.src=recUrl(seg.st,d,false);video.load();play();selUI();draw();
}
video.addEventListener("loadeddata",()=>{if(mode==="rec"){seg.ready=true;hideCenter();stat("Oynatılıyor","on")}});
video.addEventListener("seeked",pvSync);
video.addEventListener("timeupdate",pvSync);
video.addEventListener("error",()=>{
  /* kaynak biçimi desteklenmiyor: büyük olasılıkla H.265 */
  if(video.error&&video.error.code===4&&!blobUrl&&akisYedegeDus("Bu akış tarayıcıda çözülemiyor"))return;
  if(mode!=="rec"||!seg.st)return;
  if(blobUrl){                                   /* bellekteki dosya açılamadı: sunucuya dön */
    dropBlobUrl();stat("Bellekten oynatılamadı","err");
    load(seg.st.getTime()/1000,seg.d||CFG.chunk,seg.locked);return;
  }
  if(preparing)return;
  /* sunucu görüntü döndürmedi: bandı düzelt ki tünel gerçeği göstersin */
  const t0=seg.st.getTime()/1000;
  bosIsaretle(t0,t0+60);
  draw();
  stat("Kayıt yok","err");
  center("Bu aralıkta kayıt yok","Sunucu bu zaman için görüntü döndürmedi. Başka bir saat ya da tarih deneyin.",null,false)});
video.addEventListener("ended",()=>{
  if(mode!=="rec"||!seg.st)return;
  if(clip){clipStop();return}                                 /* parça bitti: kaydı kapat */
  if(seg.locked){stat("İşaretli aralık bitti","on");return}   /* aralık dışına taşma */
  if(!CFG.autoNext)return;
  const n=seg.st.getTime()/1000+seg.d;
  if(canliBolge(n)){focus=sinirla(canliAn());goLive();return}   /* uca yetişti: canlı */
  if(araligiBul(n+1)){load(n,CFG.chunk);return}      /* aynı bölüm sürüyor */
  const sonra=sonrakiAralik(n);
  if(sonra&&sonra.a-n<=(+CFG.gapJump||60)){load(sonra.a,CFG.chunk);return}  /* kısa kesinti */
  releaseSeg();                                      /* kayıt burada bitiyor */
  stat("Bu bölüm bitti","err");
  center("Kayıt burada bitiyor",
    "Zaman tünelini kaydırarak yeşil işaretli başka bir bölüme geçin.",null,false);
});

/* ---------- kayıtlı aralıklar (mutlak zaman) ----------
   Her gün ayrı taranır ama sonuçlar mutlak saniye olarak saklanır; çizim ve
   sorgulama gün tanımaz. Görünen pencereye giren günler kendiliğinden taranır. */
let tailT=null, scanTimer=null;
let rangeCache={};                 /* dISO -> [{a,b}] mutlak */

let mergeTol=2;                 /* bitişik parçaları birleştirme toleransı (sn) */
const merge=a=>{
  a=a.filter(r=>r.b>r.a).sort((x,y)=>x.a-y.a);const o=[];
  for(const r of a){const l=o[o.length-1];
    if(l&&r.a<=l.b+(mergeTol||2))l.b=Math.max(l.b,r.b);else o.push({a:r.a,b:r.b})}
  return o;
};
/* tüm bilinen günlerin aralıkları tek listede */
/* Liste her çizim karesinde yeniden kurulup sıralanıyordu; gün sayısı arttıkça
   ana iş parçacığını meşgul edip oynatmada takılmaya yol açar. Sürüm damgasıyla
   önbelleğe alınır, yalnızca veri değişince yeniden kurulur. */
let rangesSurum=0, rangesDuz=[], rangesDuzSurum=-1;
const rangesDegisti=()=>{rangesSurum++};
function tumRanges(){
  if(rangesDuzSurum!==rangesSurum){
    const o=[];for(const k in rangeCache)for(const r of rangeCache[k])o.push(r);
    rangesDuz=o.sort((x,y)=>x.a-y.a);rangesDuzSurum=rangesSurum;
  }
  return rangesDuz;
}
let kapsanan=[];                     /* zaman tünelinin sorgulanmış aralıkları */
function kapsaEkle(a,b){
  kapsanan=merge(kapsanan.concat([{a,b}]));
  if(kapsanan.length>200)kapsanan=kapsanan.slice(-200);
}
const bilinen=t=>kapsanan.some(r=>t>=r.a&&t<=r.b);
const araligiBul=t=>tumRanges().find(r=>t>=r.a-1&&t<r.b)||null;
const sonrakiAralik=t=>tumRanges().find(r=>r.a>=t-1)||null;
const hasRec=t=>!bilinen(t)||tumRanges().some(r=>t>=r.a-1&&t<=r.b+1);

/* --- JSON yanıtını çözümle (alan adları esnek) --- */
/* ---------- zaman tüneli API'si (msgpack) ----------
   Sunucu JSON kabul etmiyor; kendi arayüzü de msgpack kullanıyor ve içerik
   türünü tırnak içinde gönderiyor. Kayıt aralıklarının tek kaynağı budur:
   mp4 yoklaması bu sunucuda kayıt olmayan anlar için de görüntü döndürdüğü
   için güvenilir değil. */
/* küçük msgpack kodlayıcı/çözücü */
function mpEnc(v){
  const p=[];
  const u8=n=>p.push(n&255);
  const yaz=(...b)=>b.forEach(u8);
  const u16=n=>yaz(n>>8,n);
  const u32=n=>yaz(n>>>24,n>>>16,n>>>8,n);
  const metin=s=>{
    const b=new TextEncoder().encode(s);
    if(b.length<32)u8(0xa0|b.length); else if(b.length<256)yaz(0xd9,b.length);
    else if(b.length<65536){u8(0xda);u16(b.length)} else {u8(0xdb);u32(b.length)}
    b.forEach(u8);
  };
  const kod=v=>{
    if(v===null||v===undefined)return u8(0xc0);
    if(v===true)return u8(0xc3);
    if(v===false)return u8(0xc2);
    if(typeof v==="number"){
      if(Number.isInteger(v)){
        if(v>=0){
          if(v<128)return u8(v);
          if(v<256)return yaz(0xcc,v);
          if(v<65536){u8(0xcd);return u16(v)}
          u8(0xce);return u32(v);
        }
        if(v>=-32)return u8(0xe0|(v+32));
        if(v>=-128)return yaz(0xd0,v);
        if(v>=-32768){u8(0xd1);return u16(v)}
        u8(0xd2);return u32(v);
      }
      u8(0xcb);
      const b=new Uint8Array(8);new DataView(b.buffer).setFloat64(0,v);
      return b.forEach(u8);
    }
    if(typeof v==="string")return metin(v);
    if(Array.isArray(v)){
      if(v.length<16)u8(0x90|v.length); else if(v.length<65536){u8(0xdc);u16(v.length)} else {u8(0xdd);u32(v.length)}
      return v.forEach(kod);
    }
    const k=Object.keys(v);
    if(k.length<16)u8(0x80|k.length); else if(k.length<65536){u8(0xde);u16(k.length)} else {u8(0xdf);u32(k.length)}
    k.forEach(x=>{metin(x);kod(v[x])});
  };
  kod(v);
  return new Uint8Array(p);
}
function mpDec(buf){
  const b=buf instanceof Uint8Array?buf:new Uint8Array(buf);
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  let i=0;
  const str=n=>{const s=new TextDecoder().decode(b.subarray(i,i+n));i+=n;return s};
  const oku=()=>{
    const c=b[i++];
    if(c<0x80)return c;
    if(c<0x90){const n=c&15,o={};for(let j=0;j<n;j++){const k=oku();o[k]=oku()}return o}
    if(c<0xa0){const n=c&15,a=[];for(let j=0;j<n;j++)a.push(oku());return a}
    if(c<0xc0)return str(c&31);
    if(c===0xc0)return null;
    if(c===0xc2)return false;
    if(c===0xc3)return true;
    if(c===0xc4){const n=b[i++];const r=b.subarray(i,i+n);i+=n;return r}
    if(c===0xc5){const n=dv.getUint16(i);i+=2;const r=b.subarray(i,i+n);i+=n;return r}
    if(c===0xc6){const n=dv.getUint32(i);i+=4;const r=b.subarray(i,i+n);i+=n;return r}
    if(c===0xca){const v=dv.getFloat32(i);i+=4;return v}
    if(c===0xcb){const v=dv.getFloat64(i);i+=8;return v}
    if(c===0xcc)return b[i++];
    if(c===0xcd){const v=dv.getUint16(i);i+=2;return v}
    if(c===0xce){const v=dv.getUint32(i);i+=4;return v}
    if(c===0xcf){const v=Number(dv.getBigUint64(i));i+=8;return v}
    if(c===0xd0){const v=dv.getInt8(i);i+=1;return v}
    if(c===0xd1){const v=dv.getInt16(i);i+=2;return v}
    if(c===0xd2){const v=dv.getInt32(i);i+=4;return v}
    if(c===0xd3){const v=Number(dv.getBigInt64(i));i+=8;return v}
    if(c===0xd9)return str(b[i++]);
    if(c===0xda){const n=dv.getUint16(i);i+=2;return str(n)}
    if(c===0xdb){const n=dv.getUint32(i);i+=4;return str(n)}
    if(c===0xdc){const n=dv.getUint16(i);i+=2;const a=[];for(let j=0;j<n;j++)a.push(oku());return a}
    if(c===0xdd){const n=dv.getUint32(i);i+=4;const a=[];for(let j=0;j<n;j++)a.push(oku());return a}
    if(c===0xde){const n=dv.getUint16(i);i+=2;const o={};for(let j=0;j<n;j++){const k=oku();o[k]=oku()}return o}
    if(c===0xdf){const n=dv.getUint32(i);i+=4;const o={};for(let j=0;j<n;j++){const k=oku();o[k]=oku()}return o}
    if(c>=0xe0)return c-256;
    throw new Error("msgpack 0x"+c.toString(16));
  };
  return oku();
}

let rpcYok=false, rpcHata="", sonBirim=0, rpcTavan=0;
/* Kamera değişince yoldaki istekler hâlâ eski sunucudan dönüyor. Nesil sayacı
   ile geç gelen yanıtlar yok sayılır; yoksa eski kameranın kayıt aralıkları
   yeni kameranın tüneline yazılır. */
let kamNesil=0;   /* sunucunun döndürdüğü en fazla parça */
async function rpc(govde){
  const u=BASE+(CFG.rpcPath||"/rpc")+"?authorization="+
    encodeURIComponent("Basic "+b64(K("user")+":"+K("pass")))+
    "&content-type=%27application/x-msgpack%27";
  const r=await fetch(u,{method:"POST",credentials:"omit",body:mpEnc(govde)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=mpDec(new Uint8Array(await r.arrayBuffer()));
  if(j&&j.error)throw new Error(j.error.message||"rpc");
  return j&&j.result;
}
/* Sunucu saatiyle hizala. Tüm zaman hesabı cihazın saatine dayanıyor; kayma
   varsa tünel, kayıt aralıkları ve klip sınırları hep o kadar yanlış olur. */
async function sunucuSaati(){
  if(CFG.serverTime===false||CFG.ranges!=="rpc")return;
  const nesil=kamNesil;
  try{
    const res=await rpc({method:"get_server_info",version:12});
    if(nesil!==kamNesil)return;                 /* kamera değişti: yanıt geçersiz */
    const lt=res&&res.info&&res.info.local_time;
    if(!Array.isArray(lt)||lt.length<6)return;
    const d=new Date(lt[0],lt[1]-1,lt[2],lt[3],lt[4],lt[5],lt[6]||0);
    const fark=d.getTime()/1000-Date.now()/1000;
    if(!isFinite(fark)||Math.abs(fark)>86400)return;    /* saçma değer: yok say */
    if(Math.abs(fark)>5){                               /* küçük sapmalar önemsiz */
      saatFarki=fark;
      rangeCache={};kapsanan=[];sonBirim=0;rangesDegisti();
      focus=sinirla(focus);resetView();
      if(mode==="live")goLive(); else draw();
      rpcTazele();
    }
  }catch(e){/* alınamazsa cihaz saati kullanılmaya devam eder */}
}

const RPC_BIRIM=[1,5,10,15,30,60,240,360,720,1440];
async function rpcAralik(t0,t1){
  t0=Math.max(enErken(),t0);t1=Math.min(nowSec(),t1);
  if(t1-t0<30)return null;
  /* Çözünürlük ekran başına ~60 parça (üreticinin kuralı); istek üç ekranı
     kapsadığı için parça sayısı ~180 olur. */
  let unit=RPC_BIRIM.find(x=>x>=view.w/(+CFG.rpcParca||60))||1440;
  while((t1-t0)/unit>(+CFG.rpcMax||400)){
    const n=RPC_BIRIM[RPC_BIRIM.indexOf(unit)+1];
    if(!n)break; unit=n;
  }
  /* Parça ızgarasını mutlak zamana hizala: pencere kaydıkça ızgara kaysaydı
     aynı kaydın sınırları her tazelemede oynardı. */
  /* Sunucu bir istekte sınırlı sayıda parça döndürüyor. Sınır öğrenildikten
     sonra pencere ona göre daraltılır; yoksa bandın sonu erken kesilir ve
     pencere kaydıkça sağa sola oynar. */
  if(rpcTavan){
    const genislik=rpcTavan*unit;
    const orta=view.s+view.w/2;
    t0=Math.max(t0,orta-genislik/2);
    t1=Math.min(t1,t0+genislik);
  }
  t0=Math.floor(t0/unit)*unit;
  t1=Math.min(nowSec(),Math.ceil(t1/unit)*unit);
  if(t1-t0<unit)return null;
  const L=d=>[d.getFullYear(),d.getMonth()+1,d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds()];
  const res=await rpc({method:"archive.get_frames_timeline",version:13,params:{
    start_time:L(dateOf(t0)), end_time:L(dateOf(t1)), unit_len:unit,
    channel:+K("cam"), stream:K("rpcStream")||"video"}});
  const dizi=(res&&res.timeline)||[];
  const beklenen=Math.round((t1-t0)/unit);
  if(dizi.length&&dizi.length<beklenen-1&&(!rpcTavan||dizi.length<rpcTavan))rpcTavan=dizi.length;
  const kapsananSon=Math.min(t1,t0+dizi.length*unit);
  /* Çözünürlük değişimini yanıt geldikten sonra uygula: eski bant, yenisi
     hazır olana kadar ekranda kalsın, boş kare görünmesin. */
  if(unit!==sonBirim){rangeCache={};kapsanan=[];sonBirim=unit;}
  mergeTol=Math.max(2,unit*1.5);
  const out=[];
  for(let i=0;i<dizi.length;i++){
    if(!(dizi[i]>0))continue;
    const a=t0+i*unit;let k=i;
    while(k+1<dizi.length&&dizi[k+1]>0)k++;
    out.push({a,b:Math.min(t0+(k+1)*unit,kapsananSon)});
    i=k;
  }
  return {araliklar:merge(out),t0,t1:kapsananSon};
}
/* Tek tazeleyici, tek çözünürlük: görünen aralık ve iki yanına birer ekran. */
let rpcMesgul=false;
async function rpcTazele(){
  if(CFG.ranges!=="rpc"||rpcYok||rpcMesgul)return;
  rpcMesgul=true;
  const nesil=kamNesil;
  try{
    const s=await rpcAralik(view.s-view.w, view.s+view.w*2);
    if(nesil!==kamNesil)return;                 /* kamera değişti: yanıt geçersiz */
    if(s){
      for(const k in rangeCache)rangeCache[k]=kirp(rangeCache[k],s.t0,s.t1);
      for(const x of s.araliklar){
        const k=dISO(dateOf(dayStartOf(x.a)));
        rangeCache[k]=merge((rangeCache[k]||[]).concat([x]));
      }
      kapsaEkle(s.t0,s.t1);rangesDegisti();draw();
    }
  }catch(e){
    rpcYok=true;rpcHata=(e&&e.message)||"hata";
    stat("Kayıt bilgisi alınamadı","err");            /* uydurma yerine dürüst boşluk */
  }finally{rpcMesgul=false}
}

/* verilen pencereyi aralık listesinden çıkarır */
function kirp(list,t0,t1){
  const out=[];
  for(const r of (list||[])){
    if(t1<=r.a||t0>=r.b){out.push(r);continue}
    if(r.a<t0-1)out.push({a:r.a,b:t0});
    if(r.b>t1+1)out.push({a:t1,b:r.b});
  }
  return out;
}

function onbellekBuda(){
  const sinir=dayStartOf(enErken())-DAY;
  let degisti=false;
  for(const k in rangeCache){
    const g=Math.round(new Date(k+"T00:00:00").getTime()/1000);
    if(isFinite(g)&&g<sinir){delete rangeCache[k];degisti=true}
  }
  if(degisti)rangesDegisti();
}

/* Görünüm değiştiğinde kayıt aralıklarını tazele (kaydırma bitince). */
let sonPencere="";
function taraGorunen(){
  if(CFG.ranges!=="rpc"||rpcYok)return;
  const key=Math.round(view.s/30)+"|"+Math.round(view.w);
  if(key===sonPencere)return;
  sonPencere=key;
  clearTimeout(scanTimer);
  scanTimer=setTimeout(()=>{onbellekBuda();rpcTazele()},300);
}

/* Tarama bittiği anda kayıt sürüyorduysa, bant "şimdi"ye kadar büyümeye devam eder.
   Dakikada bir kısa bir istekle kaydın hâlâ akıp akmadığı doğrulanır. */
/* ---------- bandın ucunu güncel tutma ----------
   Karmaşık pencere/doğrulama mantığı yerine tek kural: bugünü belirli aralıklarla
   yeniden tara. Sunucunun kısa pencere ya da ince çözünürlük desteklemesi gerekmez. */
function tazeleBaslat(){
  clearInterval(tailT);
  /* Görünen aralık sık ve ince, gün taraması seyrek ve kaba tazelenir. */
  tailT=setInterval(rpcTazele,Math.max(2000,+CFG.tailMs||5000));
  rpcTazele();
}
/* Oynatma başarısız olursa o aralığı önbellekten düş: tünel yalan söylemesin. */
function bosIsaretle(t0,t1){
  const k=dISO(dateOf(dayStartOf(t0))), list=rangeCache[k];
  if(!list)return;
  rangeCache[k]=kirp(list,t0,t1);rangesDegisti();
}

/* ---------- klip alma ---------- */
/* Yalnızca KAYIT sekmesinde. Başlat'a basınca oynatılan andaki zaman işaretlenir,
   görüntü akmaya devam eder; Durdur'a basınca aralık seçim olarak belirir. */
let clip=null;

/* ekranda görünen karenin o güne ait saati */
function shownAt(){
  if(mode==="live")return dateOf(canliAn());   /* canlıda gösterilen kare */
  const p=head();
  return p==null?null:dateOf(p);
}

function clipToggle(){
  if(mode!=="rec"||preparing)return;
  if(clip)clipStop(); else clipBegin();
}
function clipBegin(){
  /* zaman akmıyorsa kayıt yanlış noktadan başlar: parça yüklenmemiş, duraklatılmış
     ya da sonuna gelmişse (oynat'a basınca baştan sarar) engellenir */
  if(video.paused){stat("Önce oynatmayı başlatın","err");return}
  if(mode!=="live"){
    if(!seg.st||!seg.ready||video.readyState<2){stat("Görüntü henüz yüklenmedi","err");return}
    if(video.ended){stat("Parça bitti · yeniden başlatın","err");return}
  }
  const t=shownAt();
  if(!t){stat("Önce bir kayıt açın","err");return}
  clip={t0:new Date(t.getTime()-(CFG.clipPre||0)*1000)};
  cv.style.cursor="default";prefetchAbort();restoreSpan();P.classList.remove("preview");prepClear();
  if(prevSpan==null)prevSpan=view.w;                  /* kullanıcının ölçeği saklanır */
  view.w=clamp(CFG.clipZoom||180,+CFG.minSpan||120,+CFG.maxSpan||DAY);
  const t0=clip.t0.getTime()/1000;
  sel={a:t0,b:t0+1};
  stat("Kayıt alınıyor","busy");selUI();draw();
}
function clipStop(){
  const t=shownAt()||dateOf(clip.t0.getTime()/1000+1);
  const a=clip.t0, b=new Date(t.getTime()+(CFG.clipPost||0)*1000);
  clip=null;cv.style.cursor="grab";
  if(b-a<2000){sel.a=sel.b=null;stat("Kayıt çok kısa","err");selUI();draw();return}
  showClip(a,b);
}
/* aralığı tünelde seçim olarak göster */
let prevSpan=null;                 /* önizleme öncesi kullanıcının seçtiği yakınlık */
function restoreSpan(){
  if(prevSpan==null)return;
  view.w=prevSpan;prevSpan=null;
  
}
function showClip(a,b){
  const s=a.getTime()/1000, e=Math.max(s+1,b.getTime()/1000);
  sel={a:s,b:e};
  if(prevSpan==null)prevSpan=view.w;                  /* prefetch kapalıyken de geri dönebilelim */
  if(!CFG.centerPin)view.s=(s+e)/2-view.w/2;
  const st=dateOf(s), len=Math.round(e-s);
  if(CFG.prefetch){
    /* "Durdur" → doğrudan "Bekleyin": aradaki durum hiç çizilmez.
       Oynatma bu sırada kesilmez; önizleme dosya hazır olunca açılır. */
    preparing=true;prepMeta={st,len};
    try{video.pause()}catch(err){}      /* akış ile indirme aynı anda bant tüketmesin */
    prepStart();draw();
    prefetchClip(st,len);
  }else{
    selUI();draw();hideCenter();
    load(s,len,true);                                /* işaretin başından oynat, sonunda dur */
    enterPreview();
    stat("İşaretli aralık · "+dur2(e-s),"on");
  }
}
$("btnClip").onclick=clipToggle;

/* oynatılan parçayı bırak: yoksa focus bir sonraki karede oynatma konumuna geri sıçrar */
function releaseSeg(){
  clipCancel();dropBlobUrl();prepClear();
  seg={st:null,d:0,locked:false,ready:false};
  try{video.pause()}catch(e){}
  video.removeAttribute("src");video.load();
}
function clipCancel(){
  if(!clip)return;
  clip=null;cv.style.cursor="grab";sel.a=sel.b=null;prefetchAbort();restoreSpan();selUI();
}
/* ---------- kayıt sonu bekçisi ----------
   Süresiz akışta "ended" olayı gelmez; kaydın bittiği yeri kendimiz izleriz.
   Aralık bilgisi taramadan geldiği için dakika altı hassasiyettedir. */
let sonKontrol=0;
function bekci(){
  if(mode!=="rec"||!seg.st||seg.locked||seg.d!=null)return;
  if(video.paused||!seg.ready||clip||preparing||kayan)return;
  const p=head();if(p==null)return;
  if(canliBolge(p)){focus=sinirla(canliAn());goLive();return}   /* uca yetişti: canlı */
  const r=araligiBul(p);
  if(!r)return;                                 /* aralık bilinmiyorsa karışma */
  if(p<r.b-.5)return;                           /* bölüm sürüyor */
  if(Date.now()-sonKontrol<1500)return;         /* arka arkaya tetiklenmesin */
  sonKontrol=Date.now();
  const sonra=sonrakiAralik(r.b);
  if(sonra&&sonra.a-r.b<=(+CFG.gapJump||60)){load(sonra.a,0);return}   /* kısa kesinti: atla */
  try{video.pause()}catch(e){}
  stat("Bu bölüm bitti","err");
  center("Kayıt burada bitiyor",
    "Zaman tünelini kaydırarak yeşil işaretli başka bir bölüme geçin.",null,false);

/* ---------- saat ---------- */
/* döngü, tuval ve diğer tanımlar hazır olduktan sonra en altta başlatılır */
function tick(){
  bekci();

    const p=head();
    const u=mode==="live"?canliAn():p;

    $("stamp").textContent=dISO(dateOf(focus))+" "+hmsAbs(focus);
    $("clock").textContent=hmsAbs(focus);   /* pin zaten bu anı gösteriyor */
  }

    else{$("stamp").textContent=dISO(dateOf(p))+" "+hmsAbs(p);
         $("clock").textContent=hmsAbs(p)}}
  /* Çizim tek noktadan, kare hızında. Eskiden parmak olaylarından da

     kaydırma titriyordu. */
